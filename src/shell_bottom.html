
<div id="updbar" hidden style="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:65;display:flex;gap:10px;align-items:center;background:#10222b;border:1px solid #ffc94d;color:#e6efe8;padding:8px 10px 8px 16px;border-radius:999px;font:700 14px system-ui,sans-serif;box-shadow:0 10px 30px #0008;max-width:calc(100% - 32px)">
  <span>🎣 A new Driftline update is ready <span style="opacity:.7;font-weight:400">· your progress is safe</span></span>
  <button id="updbtn" type="button" style="background:#ff6a3d;color:#1d0d06;border:0;border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer">Update &amp; see what’s new</button>
</div>
<script>
(function(){
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(function(){});
  function check(){
    fetch('version.txt', {cache:'no-store'}).then(function(r){ return r.ok ? r.text() : ''; }).then(function(v){
      v = (v || '').trim(); if (v && v !== window.DL_VERSION) document.getElementById('updbar').hidden = false;
    }).catch(function(){});
  }
  setInterval(check, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) check(); });
  document.getElementById('updbtn').onclick = function(){
    var go = function(){ location.reload(); };
    fetch('./', {cache:'reload'}).then(go, go);
  };
})();
</script>
</body>
</html>
