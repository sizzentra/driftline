<title>Driftline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: HUD strip, the scene (canvas), then a tabbed tackle-box panel. One committed dusk-water look. */
:root{
  color-scheme: dark;
  --bg:#0a161d; --panel:#10222b; --panel2:#152d37; --line:#23434e;
  --ink:#e6efe8; --muted:#8aa5a2; --buoy:#ff6a3d; --kelp:#7fc8a9; --gold:#ffc94d; --danger:#ff5468; --shiny:#ffe9a8;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
:fullscreen .wrap,.fs .wrap{max-width:none}
@media (min-width:1500px){body{font-size:16px}.stat b{font-size:17px}.tabs button{font-size:16px}}
/* boardwalk */
.bw-banner{position:relative;text-align:center;padding:26px 14px 14px;border-radius:14px;margin-bottom:12px;border:1px solid var(--line);overflow:hidden;
  background:repeating-linear-gradient(90deg,#c8553a 0 34px,#f4ece0 34px 68px);}
.bw-banner::after{content:"";position:absolute;inset:18px 0 0;background:linear-gradient(#10222bF2,#10222b);border-radius:12px 12px 0 0}
.bw-banner>*{position:relative;z-index:1}
.bw-banner h2{font-size:26px;letter-spacing:.02em;color:var(--gold);text-shadow:0 2px 0 #0008}
.bw-lights{position:absolute!important;left:0;right:0;top:4px;display:flex;justify-content:space-around;z-index:2!important}
.bw-lights i{width:9px;height:9px;border-radius:50%;background:#ffd84a;box-shadow:0 0 8px #ffd84a;animation:bulb 1.5s infinite}
@keyframes bulb{50%{background:#ff7a4a;box-shadow:0 0 10px #ff7a4a}}
@media (prefers-reduced-motion:reduce){.bw-lights i{animation:none}}
.bwt{position:relative;border-top:6px solid var(--c,#c8553a);background:linear-gradient(180deg,color-mix(in srgb,var(--c,#c8553a) 14%,var(--panel)),var(--panel) 60px)}
.wheelring{padding:8px;border-radius:50%;background:radial-gradient(circle,#0a161d 62%,#3a2a18 63%,#5a3a20 100%);box-shadow:0 0 0 3px #ffcc33,0 0 18px #ffcc3355}
.ducks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;padding:10px;border-radius:12px;background:linear-gradient(#2a8aa8,#1a5a78)}
.duckb{height:58px;border-radius:12px;border:0;background:transparent;font-size:34px;cursor:pointer;animation:bob 2s ease-in-out infinite}
.duckb.open,.duckb.picked{animation:none;font-size:16px;font-weight:700;background:#0a161d66;color:var(--ink)}
.duckb.picked{outline:2px solid var(--gold)}
@keyframes bob{50%{transform:translateY(-5px) rotate(4deg)}}
.hilocard{width:110px;height:140px;margin:10px auto;border-radius:12px;background:#f4ece0;color:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 20px #0006;border:3px solid #c8553a}
.hilocard b{font-family:var(--display);font-size:46px;line-height:1}
.hilocard span{font-size:13px;font-weight:700;color:#7a4a2a}
.spec{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;font:inherit;color:inherit}
.spec:hover:not(:disabled){border-color:var(--kelp)}
.spec.on{border-color:var(--gold);box-shadow:0 0 0 1px #ffc94d55;cursor:default}
.spec:disabled:not(.on){opacity:.6;cursor:not-allowed}
.spec b{font-family:var(--display);font-size:15px}
.spec .up{color:var(--kelp);font-size:13px}
.spec .down{color:#ff8a8a;font-size:13px}
/* 2.0 polish */
html,body{background:radial-gradient(1200px 600px at 50% -10%,#14303c 0%,#0a161d 60%) fixed,#0a161d}
.tile{background:linear-gradient(180deg,#132a34,#0f222b);box-shadow:0 1px 0 #ffffff08 inset,0 6px 18px #0004;transition:border-color .15s,transform .15s}
.tile:hover{border-color:#2f5866}
.btn{box-shadow:0 2px 0 #0003,0 4px 12px #ff6a3d22;transition:transform .12s,filter .12s}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.07)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.alt{box-shadow:0 2px 0 #0003}
.stat{background:linear-gradient(180deg,#14303a,#10222b)}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,#1c3d49,#152d37);box-shadow:0 0 0 1px #7fc8a944 inset}
.stage{box-shadow:0 10px 40px #0007}
h2{letter-spacing:-.01em}
.passtrack{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:12px}
.passcell{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:8px 6px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#132a34,#0f222b);font-size:12.5px}
.passcell canvas{width:72px;height:54px;cursor:default}
.passcell .lv{position:absolute;top:4px;left:7px;font-family:var(--display);font-weight:800;color:var(--muted)}
.passcell.special{border-color:#c38bff88}
.passcell.ready{border-color:var(--kelp);box-shadow:0 0 0 1px #7fc8a966,0 0 18px #7fc8a933}
.passcell.got{opacity:.6}
.pvbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 10px;margin-bottom:8px;border-radius:10px;background:#ffc94d1a;border:1px solid #ffc94d66;font-size:13.5px}
.prize{padding:6px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
/* HUD: fixed grid cells, so nothing appearing or changing inside it can move the game window */
.hud{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));align-items:stretch;gap:8px}
.hud>*{min-width:0;height:48px}
.hud .stat b,.hud .stat .lbl{overflow:hidden;text-overflow:ellipsis}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--buoy);box-shadow:0 0 0 3px #ff6a3d33;display:inline-block}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 11px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.stat b{font-family:var(--display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.coin::before{content:"";display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--gold);margin-right:5px;vertical-align:.02em;box-shadow:inset -2px -2px 0 #c9902a}
.xpbar{height:5px;border-radius:3px;background:#0a161d;margin-top:4px;overflow:hidden;min-width:90px}
.xpbar i{display:block;height:100%;background:var(--kelp);width:0}
.baitsel select{background:transparent;border:0;font-family:var(--display);font-weight:700;font-size:15px;padding:0;cursor:pointer;width:100%;min-width:0}
.baitsel select option{background:var(--panel)}
.ghost{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 12px;cursor:pointer;font-family:var(--display);font-weight:700}
.ghost:hover{border-color:var(--kelp)}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0d2430;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;cursor:pointer}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#0a161dE6;border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#05101580;padding:12px}
.card .in{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 20px;width:min(380px,100%);text-align:center;box-shadow:0 20px 50px #0008;animation:pop .28s ease-out;max-height:100%;overflow:auto}
.card .in.shiny{border-color:var(--gold);box-shadow:0 0 0 1px #ffc94d55,0 20px 60px #ffc94d33}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card .in{animation:none}}
.card canvas{width:220px;height:110px;margin:0 auto}
.card h3{font-family:var(--display);font-weight:800;font-size:23px;margin:2px 0 2px;text-wrap:balance}
.rar{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.card .nums{display:flex;justify-content:center;gap:18px;margin:8px 0;font-variant-numeric:tabular-nums}
.card .nums div{display:flex;flex-direction:column}
.card .nums span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.card .nums b{font-family:var(--display);font-size:19px}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:4px}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#ff6a3d22;color:var(--buoy);border:1px solid #ff6a3d55}
.badge.g{background:#ffc94d1f;color:var(--gold);border-color:#ffc94d55}
.badge.k{background:#7fc8a91f;color:var(--kelp);border-color:#7fc8a955}
.card .tap{color:var(--muted);font-size:13px;margin-top:8px}
.quote{font-style:italic}
.hint{margin:0;color:var(--muted);text-align:center;min-height:1.4em}
.hint b{color:var(--ink)}
/* tab strip: one scrollable row that sticks to the top while you browse a panel */
.tabs{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding:8px 0;position:sticky;top:0;z-index:5;background:var(--bg);-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:transparent;border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink)}
.tabs button .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--buoy);color:#1a0d08;font-size:12px;line-height:18px}
.tabs button:focus-visible,.btn:focus-visible,.ghost:focus-visible,.sw:focus-visible,.jcard:focus-visible{outline:2px solid var(--kelp);outline-offset:2px}
#panel{min-height:200px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
h2{font-family:var(--display);font-weight:800;font-size:19px;margin:0}
h5{font-family:var(--display);font-weight:700;font-size:14px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.btn{background:var(--buoy);color:#1d0d06;border:0;border-radius:9px;padding:7px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile.done{border-color:#ffc94d66}
.tile h4{margin:0;font-family:var(--display);font-weight:700;font-size:16px}
.tile .meta{font-size:13px;color:var(--muted)}
.tile .val{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:5px;border-radius:2px;background:#0a161d}
.pips i.on{background:var(--kelp)}
.list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.fishrow{display:grid;grid-template-columns:64px 1fr auto auto;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.fishrow canvas{width:64px;height:32px}
.fishrow .nm{font-weight:700;min-width:0}
.fishrow .nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.fishrow .val{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.fishrow .acts{display:flex;gap:6px}
.sh{color:var(--gold)}
.aq{color:var(--kelp)}
.empty{color:var(--muted);padding:26px 10px;text-align:center;border:1px dashed var(--line);border-radius:12px;margin-top:12px}
.jcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;min-width:0;cursor:pointer;font:inherit;color:inherit}
.jcard:hover{border-color:var(--kelp)}
.jcard.sel{border-color:var(--gold)}
.jcard canvas{width:100px;height:50px;pointer-events:none}
.jcard b{font-family:var(--display);font-size:14px}
.jcard small{color:var(--muted);font-size:11.5px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:8px;margin-top:8px}
.jsec{margin-top:16px}
.prog{height:6px;border-radius:3px;background:#0a161d;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--gold)}
.loc.here{border-color:var(--kelp)}
.loc .sw2{height:46px;border-radius:8px}
.tank{border-radius:12px;border:1px solid var(--line);margin-top:12px;overflow:hidden;background:#082233}
.tank canvas{height:220px;cursor:default}
.bank{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.bank b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.pts{font-family:var(--display);font-weight:800;font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums}
.detail{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:center}
.detail canvas{width:220px;height:110px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;font-size:13.5px}
.kv span{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:13px}
.chipb[aria-pressed="true"]{border-color:var(--kelp);color:var(--kelp)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--kelp)}
.stylewrap{display:grid;grid-template-columns:260px 1fr;gap:16px;margin-top:12px;align-items:start}
.preview{background:linear-gradient(#20435a,#10222b);border:1px solid var(--line);border-radius:12px}
.preview canvas{width:100%;height:auto;cursor:default}
.hatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.hatb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted)}
.hatb canvas{width:56px;height:56px;pointer-events:none}
.hatb[aria-pressed="true"]{border-color:var(--gold);color:var(--ink)}
textarea{width:100%;background:#0a161d;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px;font:12px/1.4 ui-monospace,Consolas,monospace;resize:vertical;word-break:break-all}
textarea:focus-visible{outline:2px solid var(--kelp);outline-offset:1px}
.offer canvas{width:64px;height:64px;cursor:default}
@media (max-width:640px){.stylewrap{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.detail canvas{margin:0 auto}}
.evcard .in{width:min(440px,100%)}
.chests{display:flex;gap:12px;justify-content:center;margin:12px 0}
.chests button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer}
.chests button:hover{border-color:var(--gold)}
.chests canvas{width:96px;height:72px;pointer-events:none}
.setrow{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:6px 0}
.setrow input[type=range]{width:100%;accent-color:var(--buoy)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.toggle button{min-width:64px}
.wheelwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.wheelwrap canvas{width:260px;height:260px;cursor:default}
.scratch{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center}
.scratch button{height:56px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(135deg,#8a96a0,#c8d0d8);font-size:26px;cursor:pointer}
.scratch button.open{background:var(--panel2);cursor:default}
.reveal canvas{width:120px;height:90px;cursor:default;margin:0 auto}
@media (pointer:coarse){.btn{min-height:40px}.btn.sm{min-height:36px}.chipb{min-height:36px;padding:6px 13px}.tabs button{padding:9px 16px}}
@media (max-width:700px){
  body{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-top:10px}
  .wrap{gap:8px}
  .hud{grid-template-columns:repeat(4,1fr);gap:6px}
  .hud>*{height:44px}
  .hud .brand,.hud .opt{display:none}
  .hud .loc{grid-column:span 2}
  .stat{padding:4px 9px;border-radius:9px}
  .stat b{font-size:14px}
  .ghost{padding:4px 8px;font-size:13px}
  .stage{border-radius:12px}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:10px}
  h2{font-size:17px}
}
@media (max-width:480px){.grid{grid-template-columns:1fr}.jgrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}.jcard canvas{width:84px;height:42px}}
@media (max-width:560px){.fishrow{grid-template-columns:48px 1fr auto}.fishrow canvas{width:48px;height:24px}.fishrow .acts{grid-column:1/-1}.setrow{grid-template-columns:110px 1fr 40px}}
@media (min-width:1100px){.hud{grid-template-columns:150px repeat(9,minmax(0,1fr))}}
/* phones held sideways: water on the left, menus scroll on the right (kept last so it wins) */
@media (orientation:landscape) and (max-height:560px){
  body{padding-top:6px;padding-bottom:6px}
  .wrap{max-width:none;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:10px;row-gap:6px;height:calc(100vh - 12px);height:calc(100dvh - 12px)}
  .hud{grid-column:1 / -1;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
  .hud>*{height:38px}
  .hud .brand,.hud .opt{display:none}
  .hud .loc{grid-column:auto}
  .stat{padding:3px 8px}.stat .lbl{font-size:9.5px}.stat b{font-size:13px}
  .ghost{padding:3px 6px;font-size:12px}
  .stage{grid-column:1;grid-row:2 / 4;align-self:start}
  .hint{display:none}
  .tabs{grid-column:2;grid-row:2;position:static;padding:4px 0}
  .tabs button{padding:6px 11px;font-size:13px}
  #panel{grid-column:2;grid-row:3;overflow-y:auto;min-height:0;padding-right:4px;-webkit-overflow-scrolling:touch}
  .grid{grid-template-columns:1fr 1fr}
  .stylewrap{grid-template-columns:1fr}
  .card .in{padding:10px 14px}.card canvas{width:160px;height:80px}
}
</style>

<div class="wrap">
  <header class="hud">
    <div class="brand"><i></i>Driftline</div>
    <div class="stat"><span class="lbl">Coins</span><b class="coin" id="money">0</b></div>
    <div class="stat"><span class="lbl">Level <b id="lvl" style="font-size:12px">1</b></span><div class="xpbar"><i id="xpfill"></i></div></div>
    <div class="stat loc"><span class="lbl">Fishing at</span><b id="locname">Willow Pond</b></div>
    <div class="stat opt"><span class="lbl" id="todnext">Time</span><b id="tod">Day</b></div>
    <div class="stat opt" id="wxchip" title=""><span class="lbl" id="wxnext">Weather</span><b id="wx">Clear</b></div>
    <div class="stat"><span class="lbl">Cooler</span><b id="coolerct">0 / 8</b></div>
    <div class="stat" id="buffchip" title=""><span class="lbl">Boosts</span><b id="buffct">None</b></div>
    <label class="stat baitsel"><span class="lbl">Bait</span><select id="bait"></select></label>
    <button class="ghost" id="settingsbtn" type="button">⚙ Settings</button>
