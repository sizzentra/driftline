<title>Driftline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: HUD strip, the scene (canvas), then a tabbed tackle-box panel. One committed dusk-water look. */
:root{
  color-scheme: dark;
  --bg:#0a161d; --panel:#10222b; --panel2:#152d37; --line:#23434e;
  --ink:#e6efe8; --muted:#8aa5a2; --buoy:#ff6a3d; --kelp:#7fc8a9; --gold:#ffc94d; --danger:#ff5468; --shiny:#ffe9a8;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
/* HUD: fixed grid cells, so nothing appearing or changing inside it can move the game window */
.hud{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));align-items:stretch;gap:8px}
.hud>*{min-width:0;height:48px}
.hud .stat b,.hud .stat .lbl{overflow:hidden;text-overflow:ellipsis}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--buoy);box-shadow:0 0 0 3px #ff6a3d33;display:inline-block}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 11px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.stat b{font-family:var(--display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.coin::before{content:"";display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--gold);margin-right:5px;vertical-align:.02em;box-shadow:inset -2px -2px 0 #c9902a}
.xpbar{height:5px;border-radius:3px;background:#0a161d;margin-top:4px;overflow:hidden;min-width:90px}
.xpbar i{display:block;height:100%;background:var(--kelp);width:0}
.baitsel select{background:transparent;border:0;font-family:var(--display);font-weight:700;font-size:15px;padding:0;cursor:pointer;width:100%;min-width:0}
.baitsel select option{background:var(--panel)}
.ghost{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 12px;cursor:pointer;font-family:var(--display);font-weight:700}
.ghost:hover{border-color:var(--kelp)}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0d2430;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;cursor:pointer}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#0a161dE6;border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#05101580;padding:12px}
.card .in{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 20px;width:min(380px,100%);text-align:center;box-shadow:0 20px 50px #0008;animation:pop .28s ease-out;max-height:100%;overflow:auto}
.card .in.shiny{border-color:var(--gold);box-shadow:0 0 0 1px #ffc94d55,0 20px 60px #ffc94d33}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card .in{animation:none}}
.card canvas{width:220px;height:110px;margin:0 auto}
.card h3{font-family:var(--display);font-weight:800;font-size:23px;margin:2px 0 2px;text-wrap:balance}
.rar{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.card .nums{display:flex;justify-content:center;gap:18px;margin:8px 0;font-variant-numeric:tabular-nums}
.card .nums div{display:flex;flex-direction:column}
.card .nums span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.card .nums b{font-family:var(--display);font-size:19px}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:4px}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#ff6a3d22;color:var(--buoy);border:1px solid #ff6a3d55}
.badge.g{background:#ffc94d1f;color:var(--gold);border-color:#ffc94d55}
.badge.k{background:#7fc8a91f;color:var(--kelp);border-color:#7fc8a955}
.card .tap{color:var(--muted);font-size:13px;margin-top:8px}
.quote{font-style:italic}
.hint{margin:0;color:var(--muted);text-align:center;min-height:1.4em}
.hint b{color:var(--ink)}
/* tab strip: one scrollable row that sticks to the top while you browse a panel */
.tabs{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding:8px 0;position:sticky;top:0;z-index:5;background:var(--bg);-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:transparent;border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink)}
.tabs button .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--buoy);color:#1a0d08;font-size:12px;line-height:18px}
.tabs button:focus-visible,.btn:focus-visible,.ghost:focus-visible,.sw:focus-visible,.jcard:focus-visible{outline:2px solid var(--kelp);outline-offset:2px}
#panel{min-height:200px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
h2{font-family:var(--display);font-weight:800;font-size:19px;margin:0}
h5{font-family:var(--display);font-weight:700;font-size:14px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.btn{background:var(--buoy);color:#1d0d06;border:0;border-radius:9px;padding:7px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile.done{border-color:#ffc94d66}
.tile h4{margin:0;font-family:var(--display);font-weight:700;font-size:16px}
.tile .meta{font-size:13px;color:var(--muted)}
.tile .val{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:5px;border-radius:2px;background:#0a161d}
.pips i.on{background:var(--kelp)}
.list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.fishrow{display:grid;grid-template-columns:64px 1fr auto auto;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.fishrow canvas{width:64px;height:32px}
.fishrow .nm{font-weight:700;min-width:0}
.fishrow .nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.fishrow .val{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.fishrow .acts{display:flex;gap:6px}
.sh{color:var(--gold)}
.aq{color:var(--kelp)}
.empty{color:var(--muted);padding:26px 10px;text-align:center;border:1px dashed var(--line);border-radius:12px;margin-top:12px}
.jcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;min-width:0;cursor:pointer;font:inherit;color:inherit}
.jcard:hover{border-color:var(--kelp)}
.jcard.sel{border-color:var(--gold)}
.jcard canvas{width:100px;height:50px;pointer-events:none}
.jcard b{font-family:var(--display);font-size:14px}
.jcard small{color:var(--muted);font-size:11.5px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:8px;margin-top:8px}
.jsec{margin-top:16px}
.prog{height:6px;border-radius:3px;background:#0a161d;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--gold)}
.loc.here{border-color:var(--kelp)}
.loc .sw2{height:46px;border-radius:8px}
.tank{border-radius:12px;border:1px solid var(--line);margin-top:12px;overflow:hidden;background:#082233}
.tank canvas{height:220px;cursor:default}
.bank{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.bank b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.pts{font-family:var(--display);font-weight:800;font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums}
.detail{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:center}
.detail canvas{width:220px;height:110px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;font-size:13.5px}
.kv span{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:13px}
.chipb[aria-pressed="true"]{border-color:var(--kelp);color:var(--kelp)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--kelp)}
.stylewrap{display:grid;grid-template-columns:260px 1fr;gap:16px;margin-top:12px;align-items:start}
.preview{background:linear-gradient(#20435a,#10222b);border:1px solid var(--line);border-radius:12px}
.preview canvas{width:100%;height:auto;cursor:default}
.hatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.hatb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted)}
.hatb canvas{width:56px;height:56px;pointer-events:none}
.hatb[aria-pressed="true"]{border-color:var(--gold);color:var(--ink)}
textarea{width:100%;background:#0a161d;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px;font:12px/1.4 ui-monospace,Consolas,monospace;resize:vertical;word-break:break-all}
textarea:focus-visible{outline:2px solid var(--kelp);outline-offset:1px}
.offer canvas{width:64px;height:64px;cursor:default}
@media (max-width:640px){.stylewrap{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.detail canvas{margin:0 auto}}
.evcard .in{width:min(440px,100%)}
.chests{display:flex;gap:12px;justify-content:center;margin:12px 0}
.chests button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer}
.chests button:hover{border-color:var(--gold)}
.chests canvas{width:96px;height:72px;pointer-events:none}
.setrow{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:6px 0}
.setrow input[type=range]{width:100%;accent-color:var(--buoy)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.toggle button{min-width:64px}
.wheelwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.wheelwrap canvas{width:260px;height:260px;cursor:default}
.scratch{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center}
.scratch button{height:56px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(135deg,#8a96a0,#c8d0d8);font-size:26px;cursor:pointer}
.scratch button.open{background:var(--panel2);cursor:default}
.reveal canvas{width:120px;height:90px;cursor:default;margin:0 auto}
@media (pointer:coarse){.btn{min-height:40px}.btn.sm{min-height:36px}.chipb{min-height:36px;padding:6px 13px}.tabs button{padding:9px 16px}}
@media (max-width:700px){
  body{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-top:10px}
  .wrap{gap:8px}
  .hud{grid-template-columns:repeat(4,1fr);gap:6px}
  .hud>*{height:44px}
  .hud .brand,.hud .opt{display:none}
  .hud .loc{grid-column:span 2}
  .stat{padding:4px 9px;border-radius:9px}
  .stat b{font-size:14px}
  .ghost{padding:4px 8px;font-size:13px}
  .stage{border-radius:12px}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:10px}
  h2{font-size:17px}
}
@media (max-width:480px){.grid{grid-template-columns:1fr}.jgrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}.jcard canvas{width:84px;height:42px}}
@media (max-width:560px){.fishrow{grid-template-columns:48px 1fr auto}.fishrow canvas{width:48px;height:24px}.fishrow .acts{grid-column:1/-1}.setrow{grid-template-columns:110px 1fr 40px}}
</style>

<div class="wrap">
  <header class="hud">
    <div class="brand"><i></i>Driftline</div>
    <div class="stat"><span class="lbl">Coins</span><b class="coin" id="money">0</b></div>
    <div class="stat"><span class="lbl">Level <b id="lvl" style="font-size:12px">1</b></span><div class="xpbar"><i id="xpfill"></i></div></div>
    <div class="stat loc"><span class="lbl">Fishing at</span><b id="locname">Willow Pond</b></div>
    <div class="stat opt"><span class="lbl" id="todnext">Time</span><b id="tod">Day</b></div>
    <div class="stat opt" id="wxchip" title=""><span class="lbl" id="wxnext">Weather</span><b id="wx">Clear</b></div>
    <div class="stat"><span class="lbl">Cooler</span><b id="coolerct">0 / 8</b></div>
    <div class="stat" id="buffchip" title=""><span class="lbl">Boosts</span><b id="buffct">None</b></div>
    <label class="stat baitsel"><span class="lbl">Bait</span><select id="bait"></select></label>
    <button class="ghost" id="settingsbtn" type="button">⚙ Settings</button>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Fishing scene. Hold to charge a cast, release to throw."></canvas>
    <div id="toast"></div>
    <div class="card" id="card" hidden>
      <div class="in" id="cardin">
        <canvas id="cardfish" width="440" height="220"></canvas>
        <div class="rar" id="cardrar"></div>
        <h3 id="cardname"></h3>
        <div class="badges" id="cardbadges"></div>
        <div class="nums" id="cardnums"></div>
        <div class="sub" id="carddesc"></div>
        <div class="tap">Click or press Space to keep fishing</div>
      </div>
    </div>
    <div class="card evcard" id="evcard" hidden><div class="in" id="evin"></div></div>
  </div>
  <p class="hint" id="hint"></p>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="cooler" aria-selected="true">Cooler</button>
    <button role="tab" data-tab="shop" aria-selected="false">Tackle shop</button>
    <button role="tab" data-tab="skills" aria-selected="false">Skills</button>
    <button role="tab" data-tab="aquarium" aria-selected="false">Aquarium</button>
    <button role="tab" data-tab="bounties" aria-selected="false">Bounties</button>
    <button role="tab" data-tab="feats" aria-selected="false">Feats</button>
    <button role="tab" data-tab="journal" aria-selected="false">Encyclopedia</button>
    <button role="tab" data-tab="map" aria-selected="false">Waters</button>
    <button role="tab" data-tab="style" aria-selected="false">Wardrobe</button>
    <button role="tab" data-tab="pets" aria-selected="false">Pets</button>
    <button role="tab" data-tab="games" aria-selected="false">Boardwalk</button>
    <button role="tab" data-tab="save" aria-selected="false">Save</button>
    <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
  </nav>
  <section id="panel" role="tabpanel"></section>
</div>

<script>
(() => {
'use strict';
// ---------- data ----------
const RAR = [
  {k:'Common',    c:'#b9c6c3', w:60,  f:0,   xp:1},
  {k:'Uncommon',  c:'#7fc8a9', w:26,  f:.5,  xp:1.5},
  {k:'Rare',      c:'#5aa9ff', w:10,  f:1,   xp:2.5},
  {k:'Epic',      c:'#c38bff', w:3.4, f:1.6, xp:4},
  {k:'Legendary', c:'#ffc94d', w:.6,  f:2.4, xp:8},
];
const LOCS = [
  {id:'pond',  name:'Willow Pond',     cost:0,      need:0, bonus:800,    plat:'dock',  blurb:'A quiet pond behind the boathouse. Gentle fish, good for learning the line.',
   sky:['#86bcd9','#f2dcb6'], water:['#3f827b','#173e42'], hill:'#2d5a3e', amp:.07, freq:2.3, depth:'1–3 m', loot:40},
  {id:'river', name:'Stonebrook River', cost:600,    need:8, bonus:4000,   plat:'dock',  blurb:'Fast cold water over stones. Trout and pike that fight back.',
   sky:['#8cc2e0','#e9e2c4'], water:['#3a7690','#143547'], hill:'#3b5a4a', amp:.12, freq:3.4, depth:'2–6 m', loot:120},
  {id:'coast', name:'Saltmarsh Coast',  cost:2500,   need:8, bonus:15000,  plat:'pier',  blurb:'Grey dunes and a long pier. Strong saltwater fish and the first tuna.',
   sky:['#9ec9df','#f4e2c0'], water:['#2f6f93','#0f2e48'], hill:'#8a8263', amp:.035, freq:5.5, depth:'4–20 m', loot:400},
  {id:'frost', name:'Frostbite Lake',   cost:6000,   need:8, bonus:35000,  plat:'ice',   blurb:'A frozen lake far north. Open leads in the ice, snow on the pines, and fish that like the cold.',
   sky:['#a9c6dc','#eef2f5'], water:['#2a6a86','#07202e'], hill:'#e3ebf0', amp:.09, freq:2.8, depth:'5–40 m', loot:800},
  {id:'reef',  name:'Coral Shallows',   cost:15000,  need:8, bonus:80000,  plat:'sand',  blurb:'Warm turquoise water over a living reef. The colours are unreal and so are the fish.',
   sky:['#6fc3ec','#fbe7c3'], water:['#2bb3b8','#0b4f6e'], hill:'#3e8f4e', amp:.035, freq:1.6, depth:'1–30 m', loot:1600},
  {id:'shelf', name:'Brine Shelf',      cost:35000,  need:8, bonus:180000, plat:'boat',  blurb:'Open sea at the edge of the shelf. Marlin country. Bring heavy line.',
   sky:['#7fb4d8','#e6d9c9'], water:['#1f5a8a','#081f3a'], hill:'#3f5468', amp:0, freq:1, depth:'30–200 m', loot:3500},
  {id:'deep',  name:'Midnight Deep',    cost:80000,  need:8, bonus:400000, plat:'trawler', blurb:'Far offshore on a trawler. The swell is huge, and the big game is bigger.',
   sky:['#557595','#c7b9b0'], water:['#163f6e','#030b1a'], hill:'#24384c', amp:0, freq:1, depth:'500–3,000 m', loot:8000},
  {id:'trench',name:'Hollow Trench',    cost:180000, need:8, bonus:1000000, plat:'raft', blurb:'Black water over a drop no one has measured. Things down here glow.',
   sky:['#5d7f99','#b9b1b8'], water:['#123a55','#02080f'], hill:'#1b2a36', amp:0, freq:1, depth:'1,000 m +', loot:18000},
];
const SEA = ['shelf','deep','trench'];
// fight behaviours
const BEH = {
  calm:  {n:'Calm',     runMul:.7, restMul:1.35, d:'Calm. Rarely runs, easy to read.'},
  dart:  {n:'Darter',   runMul:.5, restMul:.55, d:'Darter. Short, frequent bursts.'},
  run:   {n:'Runner',   runMul:1.6,restMul:1.1, d:'Runner. Long, powerful runs that strip line.'},

function migrate(o){ const d=fresh(); if(!o||typeof o!=='object') return d; const m=Object.assign(d,o);
  m.gear=Object.assign(fresh().gear,o.gear||{}); for(const k in GEAR) m.gear[k]=clamp(m.gear[k]|0,0,GEAR[k].lv.length-1);
  m.bait=Object.assign(baitZero(),o.bait||{}); if(!BAIT[m.baitSel]) m.baitSel='worm';
  m.stats=Object.assign(fresh().stats,o.stats||{}); m.perks=Object.assign({},o.perks||{}); for(const k in m.perks){ if(!PERKS[k]) delete m.perks[k]; else m.perks[k]=Math.min(m.perks[k],PERKS[k].max); }
  m.feats=Object.assign({},o.feats||{}); m.tank=(m.tank||[]).filter(f=>SPI[f.id]); m.cooler=(m.cooler||[]).filter(f=>SPI[f.id]);
  m.unlocked=(m.unlocked||['pond']).filter(id=>LOCS.some(l=>l.id===id)); if(!m.unlocked.includes('pond')) m.unlocked.unshift('pond'); if(!m.unlocked.includes(m.loc)) m.loc='pond';
  for(const k in m.journal){ if(!SPI[k]) delete m.journal[k]; }
  m.look=Object.assign(fresh().look,o.look||{}); const ow=o.owned||{};
  m.owned={hats:uniq([...d.owned.hats,...(ow.hats||[])]).filter(h=>HATI[h]), cols:uniq(ow.cols||[]), pats:uniq(['none',...(ow.pats||[])]), pets:uniq(['dog',...(ow.pets||[])]).filter(p=>PETI[p])};
  if(!m.owned.hats.includes(m.look.hat)) m.look.hat='cap'; if(!PETI[m.pet]||!m.owned.pets.includes(m.pet)) m.pet='dog';
  m.buffs=(o.buffs||[]).filter(b=>b&&BK[b.k]&&b.until>Date.now()); m.junk=Object.assign({},o.junk||{});
  m.settings=Object.assign(fresh().settings,o.settings||{}); const aq=Object.assign(fresh().aq,o.aq||{}); aq.owned=uniq(['lagoon','gold',...(aq.owned||[])]); aq.decor=(aq.decor||[]).filter(x=>aq.owned.includes(x)); m.aq=aq;
  m.tokens=Object.assign(fresh().tokens,o.tokens||{}); m.gstats=Object.assign(fresh().gstats,o.gstats||{}); delete m.muted;
  m.bounties=(m.bounties||[]).filter(b=>SPI[b.sp]); if(m.tankSlots>TANK_COST.length) m.tankSlots=TANK_COST.length; m.v=3; return m; }

let cloudDoc = null, saveTimer = null, saving = false, pendingSave = false;
function save(){ S.savedAt = Date.now(); try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  if (cloudDoc){ clearTimeout(saveTimer); saveTimer = setTimeout(pushCloud, 2500); } }
async function pushCloud(){ if(!cloudDoc) return; if(saving){ pendingSave=true; return; } saving=true;
  try{ await cloudDoc.set({state: JSON.parse(JSON.stringify(S))}); }catch(e){ if(e && (e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')) cloudDoc=null; }
  saving=false; if(pendingSave){ pendingSave=false; pushCloud(); } }
async function initCloud(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
    if(!user || !db) return; const id = await user.id(); if(!id) return;
    const doc = db.doc('data/users/'+id+'/save');
    const snap = await doc.get(); cloudDoc = doc;
    if(snap.exists){ const st = snap.data() && snap.data().state; if(st && (st.savedAt||0) > (S.savedAt||0) && G.st==='idle'){ S = migrate(JSON.parse(JSON.stringify(st))); offlineIncome(); try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} refreshAll(); toast('Progress loaded from your account'); } }
    else if(S.savedAt) pushCloud();
  }catch(e){ cloudDoc=null; }
}

function mix(a,b,t){ const A=hex2rgb(rgb2hex(a)),B=hex2rgb(rgb2hex(b)); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); }
function rgb2hex(s){ if(s[0]==='#') return s; const m=s.match(/\d+/g); return '#'+m.slice(0,3).map(v=>(+v).toString(16).padStart(2,'0')).join(''); }

const CYCLE = 360;
function phase(){ return (Date.now()/1000 % CYCLE)/CYCLE; }
function tod(p=phase()){ if(p<.05||p>=.95) return 'Dawn'; if(p<.45) return 'Day'; if(p<.55) return 'Dusk'; return 'Night'; }
function isNight(p=phase()){ const t=tod(p); return t==='Night'||t==='Dusk'; }
function timeOk(sp,p){ if(sp.time==='any') return true; if(sp.time==='night') return isNight(p) || !!weather().fog; return !isNight(p) || tod(p)==='Dusk'; }
function nextFlip(){ const p=phase(); const target = isNight(p) ? .95 : .45; let d = target - p; if(d<0) d+=1; return {label: isNight(p)?'Day in':'Dusk in', s: Math.round(d*CYCLE)}; }
function weatherAt(slot){ const h = (Math.imul(slot ^ 0x9e3779b9, 2654435761) >>> 0) % 10000 / 100; let x=h; for(const w of WEATHERS){ x-=w.w; if(x<0) return w; } return WEATHERS[0]; }
function weather(){ return weatherAt(Math.floor(Date.now()/1000/WX_LEN)); }
function wxLeft(){ return Math.ceil(WX_LEN - (Date.now()/1000 % WX_LEN)); }
const mmss = s => Math.floor(s/60)+':'+String(Math.max(0,s)%60).padStart(2,'0');

let AC=null, BUS=null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)();
    BUS={master:AC.createGain(), sfx:AC.createGain(), music:AC.createGain(), amb:AC.createGain()}; BUS.master.connect(AC.destination); BUS.sfx.connect(BUS.master); BUS.music.connect(BUS.master); BUS.amb.connect(BUS.master); applyVolumes();
  }catch(e){ return null; } } if(AC.state==='suspended') AC.resume(); return AC; }
function applyVolumes(){ if(!BUS) return; const s=S.settings, t=AC.currentTime; const set=(gn,v)=>{ gn.gain.cancelScheduledValues(t); gn.gain.setTargetAtTime(v,t,.08); };
  set(BUS.master,s.master); set(BUS.sfx,s.sfx); set(BUS.music,s.musicOn?s.music*.7:0); set(BUS.amb,s.ambient?s.amb*.6:0); }
function tone(f,dur,type='sine',vol=.12,slide=0,delay=0){ if(!S.settings.sfx||!S.settings.master) return; const a=ac(); if(!a) return; const t=a.currentTime+delay; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(BUS.sfx); o.start(t); o.stop(t+dur+.02); }
function noise(dur,vol=.2,freq=900){ if(!S.settings.sfx||!S.settings.master) return; const a=ac(); if(!a) return; const n=a.sampleRate*dur, b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n); const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; const g=a.createGain(); g.gain.value=vol; s.connect(f).connect(g).connect(BUS.sfx); s.start(); }
const sfx = {
  cast(){ tone(500,.25,'triangle',.05,600); },
  splash(){ noise(.35,.25,700); },
  nibble(){ tone(320,.06,'sine',.05); },
  bite(){ noise(.25,.3,500); tone(880,.08,'square',.06); tone(1180,.1,'square',.06,0,.09); },
  tick(){ tone(1400+Math.random()*200,.02,'square',.015); },
  snap(){ tone(220,.35,'sawtooth',.12,-160); noise(.15,.2,2400); },
  lost(){ tone(400,.3,'triangle',.08,-200); },
  catch(r){ const base=[523,659,784,988,1175]; for(let i=0;i<=2+r;i++) tone(base[i%5],.22,'triangle',.08,0,i*.08); },
  shiny(){ for(let i=0;i<6;i++) tone(1568+i*220,.18,'sine',.06,0,.4+i*.06); },
  coin(){ tone(1320,.08,'square',.05); tone(1760,.12,'square',.05,0,.07); },
  thunder(){ noise(1.2,.25,120); },
  jump(){ noise(.3,.3,1200); tone(300,.15,'triangle',.05,300); },
  warn(){ tone(180,.08,'square',.05); },
  hot(){ tone(1046,.12,'sine',.06); tone(1318,.16,'sine',.06,0,.1); },

  if(S.baitSel!=='worm' && S.bait[S.baitSel]<=0){ S.baitSel='worm'; renderBait(); }

  G.biteAt = rnd(1.4,4.6)/speed; G.nib=[]; const n=Math.floor(Math.random()*3); for(let i=0;i<n;i++) G.nib.push(rnd(.5,Math.max(.6,G.biteAt-.4))); G.nibOn=0;
  splash(G.bob.x,G.bob.y,10); sfx.splash(); if(G.inHot){ splash(G.bob.x,G.bob.y,14); sfx.hot(); toast('Right in the hotspot! Rare fish are gathering.'); } }
const junkChance = () => .05*(1+.1*pr('scavenger'))*(1+bonus('treasure'))*(BAIT[S.baitSel].treasure||1)*(G.inHot?1.5:1);
function pickJunk(){ const ws=JUNK.map(j=>JUNK_W[j.t]); let x=Math.random()*ws.reduce((a,b)=>a+b,0); for(let i=0;i<JUNK.length;i++){ x-=ws[i]; if(x<=0) return JUNK[i]; } return JUNK[0]; }
const fishHatsLeft = () => HATS.filter(h=>h.src==='fish' && !S.owned.hats.includes(h.id));
function chooseCatch(){
  const p=phase(), b=BAIT[S.baitSel], wx=weather(), li=locIdx(S.loc); const weak={str:1.5+li*2.2, th:.15, beh:'calm', aggr:.15, kg:1};
  if(Math.random() < .007*(G.inHot?2.5:1)*(1+bonus('treasure')*.5) && fishHatsLeft().length) return Object.assign({kind:'hat', hat:pick(fishHatsLeft())}, weak);
  if(Math.random() < junkChance()) return Object.assign({kind:'junk', item:pickJunk()}, weak);
  let rare = b.rare + ROD_RARE[S.gear.rod] + (G.lastCast>farAt() ? .2+.03*pr('caster') : 0) + .06*pr('lucky') + (wx.rare||0) + bonus('rare')*2 + (isNight(p)?.1*pr('nightowl'):0) + (G.inHot?1:0);
  if(S.baitSel==='glow' && isNight(p)) rare*=1.5; if(b.loc===S.loc) rare*=1.6; if(b.sea && SEA.includes(S.loc)) rare*=1.5;
  const pool=SP.filter(s=>s.loc===S.loc && timeOk(s,p)); const ws=pool.map(s=>RAR[s.r].w*(1+rare*RAR[s.r].f));
  let x=Math.random()*ws.reduce((a,c)=>a+c,0), sp=pool[0]; for(let i=0;i<pool.length;i++){ x-=ws[i]; if(x<=0){ sp=pool[i]; break; } }
  const tb = 1 + bonus('trophy') + .06*pr('trophy') + (b.trophy||0);
  const kg = sp.min + (sp.max-sp.min)*Math.pow(Math.random(),1.8/tb);
  const rel=(kg-sp.min)/(sp.max-sp.min); const str=sp.str*(.8+.4*rel)*(wx.str||1);

  const trophy = rel > .9;
  let value = Math.max(1,Math.round(sp.base*Math.pow(kg/((sp.min+sp.max)/2),.85)));
  value=Math.round(value*(1+.1*mastery(sp.id))); if(trophy) value=Math.round(value*1.5); if(shiny) value*=4;
  return {kind:'fish', sp, kg, rel, str, th:sp.th, beh:sp.beh, aggr:sp.aggr, value, shiny, trophy, storm: wx.k==='Storm', hot:G.inHot};
}
function hookIt(){ const perfect = (G.waitT - (G.biteEnd - hookWin())) < .3*hookWin(); G.fish = G.pend || chooseCatch(); G.pend=null; G.perfect = perfect;

  if(perfect){ G.sta=.65; G.ten=0; G.runT=rnd(1,1.6); S.stats.perfect++; toast('Perfect hook! The fish starts tired.'); tone(990,.1,'triangle',.07,0,.05); } }
function breakStreak(){ if(S.streak>=3) setTimeout(()=>toast('Streak of '+S.streak+' ended'),1200); S.streak=0; }
function endFight(kind){
  if(kind==='caught'){ G.st='landing'; G.land={t:0, dur:.85, x0:G.bob.x, y0:G.bob.y}; splash(G.bob.x,G.bob.y,24); sfx.pull(); return; }

  if(kind==='snap'){ S.stats.snapped++; sfx.snap(); toast(G.temper>1.6 ? 'Snap! It lost its temper. Let go now and then.' : 'Snap! The line broke. Ease off when it runs.'); checkFeats(); save(); }

function finishCatch(){ const f=G.fish; G.land=null; if(!f){ G.st='idle'; return; }
  if(f.hot) S.stats.hot++; G.inHot=false;
  if(f.kind==='fish') landFish(); else if(f.kind==='hat') landHat(); else landJunk(); }
function landFish(){
  const f=G.fish, sp=f.sp; G.st='result'; G.fish=null;
  const j=S.journal[sp.id]; const isNew=!j; const record = j && f.kg > j.best;
  S.journal[sp.id] = {n:(j?j.n:0)+1, best:Math.max(j?j.best:0, +f.kg.toFixed(3)), sh:(j&&j.sh)||f.shiny, tr:(j&&j.tr)||f.trophy, bv:Math.max((j&&j.bv)||0, f.value), first:(j&&j.first)||Date.now()};

  f.demand = demandSp().id===sp.id; if(f.demand) S.stats.demand++; f.streakBonus=streakBonus;

  if(f.shiny) S.stats.shiny++; if(f.trophy) S.stats.trophies++; if(f.storm && sp.r>=3) S.stats.stormEpic++;
  const lvUps = addXP(xp); const bdone = checkBounties(sp, f.kg); const setNow = checkSet(sp.loc);
  const b=[]; if(f.shiny) b.push(['g','Shiny ×4 value']); if(f.trophy) b.push(['g','Trophy size ×1.5']); if(f.hot) b.push(['k','Hotspot catch']);
  if(f.demand) b.push(['g','Fishmonger wants it: ×2 if sold now']); if(G.perfect) b.push(['','Perfect hook']); if(S.streak>=2) b.push(['','Streak '+S.streak+' · +'+Math.round(streakBonus*100)+'% XP']);
  if(isNew) b.push(['','New species']); if(record) b.push(['g','Personal record']); const ae=aqBase(sp.id); if(ae && isNew) b.push(['k','In the aquarium: '+fmtB(ae.k,ae.v)]);
  const ms=mastery(sp.id); if(ms && [3,10,30,100][ms-1]===S.journal[sp.id].n) b.push(['g','Mastery '+'★'.repeat(ms)+': +'+ms*10+'% value for this fish']);

    nums:[['Weight',kgStr(f.kg)],['Worth',fmt(f.value),1],['XP','+'+xp]], desc:sp.note, badges:b});

}
function landJunk(){

function down(e){
  if(G.star && starHit(e)) return;
  switch(G.st){
    case 'frenzy': frenzyHit(e); break;
    case 'idle': startCharge(); break;
    case 'waiting': G.st='idle'; G.inHot=false; breakStreak(); toast('Reeled in early. Wait for the big splash.'); break;
    case 'bite': hookIt(); break;
    case 'reeling': G.hold=true; break;
    case 'result': hideCard(); break;
  }
}

// ---------- update ----------
function update(dt){
  if(G.st==='charging'){ G.power+=G.pdir*dt*1.15; if(G.power>=1){G.power=1;G.pdir=-1;} if(G.power<=0){G.power=0;G.pdir=1;} }
  else if(G.st==='flying'){ G.t+=dt/.45; const t=Math.min(1,G.t); G.bob.x=G.from.x+(G.to.x-G.from.x)*t; G.bob.y=G.from.y+(G.to.y-G.from.y)*t - Math.sin(t*Math.PI)*H*.22; if(t>=1) beginWait(); }
  else if(G.st==='waiting'){ G.waitT+=dt; G.nibOn=Math.max(0,G.nibOn-dt);
    for(let i=G.nib.length-1;i>=0;i--) if(G.waitT>=G.nib[i]){ G.nib.splice(i,1); G.nibOn=.3; sfx.nibble(); }
    if(G.waitT>=G.biteAt){ G.pend=chooseCatch(); G.st='bite'; G.biteEnd=G.waitT+hookWin(); sfx.bite(); splash(G.bob.x,G.bob.y,12); } }
  else if(G.st==='bite'){ G.waitT+=dt; if(G.waitT>G.biteEnd){ G.pend=null; endFight('nohook'); } }
  else if(G.st==='reeling'){ fight(dt); }
  else if(G.st==='landing'){ G.land.t+=dt; if(G.land.t>=G.land.dur) finishCatch(); }
  for(let i=G.parts.length-1;i>=0;i--){ const p=G.parts[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=420*dt; if(p.t>p.life) G.parts.splice(i,1); }
  if(weather().k==='Storm'){ G.nextBolt-=dt; if(G.nextBolt<=0){ G.flash=1; G.nextBolt=rnd(6,16); setTimeout(()=>sfx.thunder(),400); } }
  G.flash=Math.max(0,G.flash-dt*2.5);
  // hotspots: ripples on the water where rare fish gather
  if(G.hot){ G.hot.t+=dt; if(G.hot.t>G.hot.life) G.hot=null; }
  else { G.hotNext-=dt*hotRate(); if(G.hotNext<=0){ G.hot={p:rnd(.2,.97), r:.065, t:0, life:rnd(14,22)*(1+.05*pr('reader'))}; G.hotNext=rnd(14,32); } }
  updateEvents(dt);
}
function fight(dt){
  const f=G.fish, B=BEH[f.beh]||BEH.calm, line=gv('line'), reel=reelSpeed(); const ratio=clamp(f.str/line,.05,4);
  G.runT-=dt; if(G.runT<=0){ G.run=!G.run; G.runT = G.run ? rnd(.4,1.1)*(.6+f.th)*B.runMul*(.5+.5*G.sta) : rnd(.5,1.7)*(1.3-f.th)*B.restMul/(.4+.6*G.sta); if(G.run){ splash(G.bob.x,G.bob.y,6); G.ev=null; } }
  if(!G.run && (B.shake||B.jump) && !G.ev){ G.evT-=dt; if(G.evT<=0){ G.ev=B.jump?'jump':'shake'; G.evDur=B.jump?.85:.5; G.evT=rnd(1.3,3)/(.5+f.aggr)*(.6+.4/(.3+G.sta)); if(B.jump){ splash(G.bob.x,G.bob.y,14); sfx.jump(); } else sfx.warn(); } }
  if(G.ev){ G.evDur-=dt; if(G.evDur<=0){ if(G.ev==='jump') splash(G.bob.x,G.bob.y,16); G.ev=null; } }
  const tired=.45+.55*G.sta, steady=tensionMult();
  if(G.hold){
    G.d -= reel*dt*(G.run?.25:1)*(B.drag?.75:1);
    let add = (G.run?70:22)*ratio*tired*(B.heavy?1.35:1);
    G.temper = Math.min(3, G.temper + dt*(.3+f.aggr*.9)*tempMult());
    add += 36*G.temper*G.temper*(.4+f.aggr)*Math.pow(ratio,.3)*(.35+.65*G.sta);
    if(G.ev==='jump') add += 170; else if(G.ev==='shake') add += 110*Math.pow(ratio,.25)+30;
    G.ten += add*steady*dt;
    G.sta = Math.max(0, G.sta - (G.run?.18:.09)*dt*(B.heavy?.6:1));
    G.tickT-=dt; if(G.tickT<=0){ G.tickT=.07; sfx.tick(); }
  } else {
    G.temper = Math.max(0, G.temper - dt*1.8);
    G.ten = Math.max(0, G.ten - 55*dt);
    if(G.run) G.d += (1.5 + f.str*.18) * (.35+.65*G.sta) * dt;
    if(B.drag && !G.run) G.d += (.4 + f.str*.04) * (.3+.7*G.sta) * dt;
    G.sta = Math.max(0, G.sta - .045*dt);
  }
  if(G.run && !G.hold) G.ten = Math.max(G.ten, 6);
  if(G.ten>75 && G.hold){ G.warnT-=dt; if(G.warnT<=0){ G.warnT=.25; sfx.warn(); } }
  const frac = clamp(G.d/G.d0,0,1.6); const x0=W*.24, x1=castX(G.lastCast);
  G.bob.x = x0 + (x1-x0)*Math.min(frac,1.25) + (G.run ? Math.sin(performance.now()/90)*3 : 0) + (G.ev==='shake'?Math.sin(performance.now()/30)*3:0); G.bob.y = waterY(G.bob.x);
  if(G.ten>=100) endFight('snap'); else if(G.d>=G.maxOut) endFight('spool'); else if(G.d<=0) endFight('caught');
}

// ---------- drawing: creatures ----------
function drawFish(c,x,y,L,col,belly,h=.38,wag=0,flip=false,o={}){
  c.save(); c.translate(x,y); if(flip) c.scale(-1,1); const H2=L*h; const w=Math.sin(wag)*L*.04; const a0=c.globalAlpha;
  c.fillStyle=col; c.beginPath(); c.moveTo(-L*.4,0); c.lineTo(-L*.62,-Math.max(H2*.6,L*.12)+w); c.lineTo(-L*.55,w*.5); c.lineTo(-L*.62,Math.max(H2*.6,L*.12)+w); c.closePath(); c.fill();
  c.beginPath(); if(o.shark){ c.moveTo(L*.5,H2*.05); c.quadraticCurveTo(L*.3,-H2*.55,-L*.1,-H2*.5); c.quadraticCurveTo(-L*.42,-H2*.3,-L*.44,0); c.quadraticCurveTo(-L*.3,H2*.5,0,H2*.5); c.quadraticCurveTo(L*.35,H2*.45,L*.5,H2*.05); }
  else c.ellipse(0,0,L*.46,H2*.5,0,0,Math.PI*2); c.fill();
  c.save(); c.clip(); c.fillStyle=belly; c.beginPath(); c.ellipse(L*.02,H2*.36,L*.46,H2*.3,0,0,Math.PI*2); c.fill();
  if(o.pat===1){ c.fillStyle='rgba(10,20,25,.28)'; for(let i=-3;i<=3;i++){ c.fillRect(i*L*.11-L*.025,-H2,L*.05,H2*2); } }
  if(o.pat===2){ c.fillStyle = lum(col)>170 ? belly : 'rgba(10,20,25,.3)'; for(let i=0;i<9;i++){ c.beginPath(); c.arc(-L*.3+((i*37)%60)/100*L*.7, -H2*.3+((i*53)%50)/100*H2*.6, Math.max(1,L*.03),0,7); c.fill(); } }
  c.restore();
  c.fillStyle=col; c.globalAlpha=a0*.9; c.beginPath();
  if(o.shark){ c.moveTo(-L*.12,-H2*.42); c.lineTo(-L*.02,-H2*.5-L*.2); c.lineTo(L*.1,-H2*.44); }
  else { c.moveTo(-L*.14,-H2*.44); c.quadraticCurveTo(L*.02,-H2*.5-L*.13,L*.16,-H2*.42); }
  c.closePath(); c.fill(); c.globalAlpha=a0;
  c.fillStyle='#0b1418'; c.beginPath(); c.arc(L*.31,-H2*.08,Math.max(1.4,L*.032),0,7); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(L*.32,-H2*.11,Math.max(.6,L*.012),0,7); c.fill();
  c.restore();
}
function drawCreature(c,sp,x,y,L,o={}){
  let col=sp.col, belly=sp.belly; if(o.shiny){ col=mix(col,'#ffd36a',.45); belly=mix(belly,'#fff6d6',.5); } if(o.sil){ col=belly=o.sil; }
  const wag=o.wag||0, pat=o.sil?0:sp.pat;
  if(sp.shape==='f'||sp.shape==='e'||sp.shape==='s'){ drawFish(c,x,y,L,col,belly,sp.h,wag,o.flip,{shark:sp.shape==='s',pat}); return; }
  c.save(); c.translate(x,y); if(o.flip) c.scale(-1,1); const a0=c.globalAlpha; const eye=(ex,ey,r)=>{ c.fillStyle=o.sil||'#0b1418'; c.beginPath(); c.arc(ex,ey,r,0,7); c.fill(); if(!o.sil){ c.fillStyle='#fff'; c.beginPath(); c.arc(ex+r*.3,ey-r*.3,r*.35,0,7); c.fill(); } };
  if(sp.shape==='p'){ const r=L*.3; c.strokeStyle=col; c.lineWidth=Math.max(1,L*.025); c.beginPath(); for(let i=0;i<14;i++){ const a=i/14*Math.PI*2; c.moveTo(Math.cos(a)*r,Math.sin(a)*r*.9); c.lineTo(Math.cos(a)*r*1.25,Math.sin(a)*r*1.15); } c.stroke();
    c.fillStyle=col; c.beginPath(); c.moveTo(-r*.9,0); c.lineTo(-r*1.5,-r*.5+Math.sin(wag)*2); c.lineTo(-r*1.5,r*.5+Math.sin(wag)*2); c.fill();

// ---------- scene chip (time & weather, shown on narrow screens) ----------
function drawSceneChip(p,wx){ if(W>=700) return; const nf=nextFlip(); const txt=tod(p)+' · '+wx.k+' · '+mmss(wxLeft()); g.font='700 11px system-ui'; const tw=g.measureText(txt).width; g.fillStyle='rgba(5,14,20,.6)'; rr(10,10,tw+16,20,10); g.fill(); g.fillStyle=wx.k==='Gilded'?'#ffc94d':'#e6efe8'; g.textAlign='left'; g.fillText(txt,18,24); }

// ---------- random events & mini-games ----------
let pendingEvent=null, catchesSinceEvent=0;
function afterCard(){ catchesSinceEvent++; if(pendingEvent){ const ev=pendingEvent; pendingEvent=null; openEvent(ev); return; }
  if(S.stats.caught>=5 && catchesSinceEvent>=6 && Math.random()<.12){ catchesSinceEvent=0; openEvent(Math.random()<.55?'frenzy':'chests'); } }
function openEvent(kind){ const box=$('evin'); G.st='event';
  if(kind==='frenzy'){ box.innerHTML=`<div class="rar" style="color:var(--gold)">Mini-game</div><h3>Fish frenzy!</h3><p class="sub">A shoal is leaping out of the water. Tap as many fish as you can in 10 seconds. Every fish is worth coins.</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-ev="frenzy">Let’s go!</button><button class="btn alt" data-ev="skip">Not now</button></div>`; }
  else { box.innerHTML=`<div class="rar" style="color:var(--gold)">Mini-game</div><h3>Three chests washed up</h3><p class="sub">Only one holds the big prize. Pick one.</p><div class="chests">${[0,1,2].map(i=>`<button data-ev="chest" data-i="${i}" aria-label="Chest ${i+1}"><canvas width="192" height="144" data-chest></canvas></button>`).join('')}</div><div class="row" style="justify-content:center"><button class="btn alt" data-ev="skip">Leave them</button></div>`;
    box.querySelectorAll('canvas[data-chest]').forEach(c=>{ const cx=c.getContext('2d'); drawJunk(cx,c.width,c.height,'chest'); }); }
  $('evcard').hidden=false; sfx.hot(); }
function closeEvent(){ $('evcard').hidden=true; if(G.st==='event') G.st='idle'; }
$('evcard').addEventListener('click',e=>{ const b=e.target.closest('[data-ev]'); if(!b) return; const ev=b.dataset.ev; startAudio();
  if(ev==='skip'){ closeEvent(); return; }
  if(ev==='frenzy'){ closeEvent(); G.st='frenzy'; G.fz={t:0,dur:10,next:0,jumpers:[],caught:0}; toast('Tap the leaping fish!'); return; }
  if(ev==='chest'){ const L=curLoc(); const base=bestLoot(); const prizes=[{k:'big',txt:'',run:()=>{ const c=earn(base*rnd(6,10)*coinMult()); return '+'+fmt(c)+' coins!'; }},
      {k:'lure',run:()=>{ const opts=Object.keys(BAIT).filter(k=>k!=='worm'&&!BAIT[k].junk); const k=pick(opts); S.bait[k]+=6; return '6 '+BAIT[k].name; }},
      {k:'boost',run:()=>{ const fo=pick(FORTUNES); addBuff(fo[1],fo[2],10,'Lucky chest'); return 'Boost: '+fmtB(fo[1],fo[2])+' for 10 min'; }}];
    for(let i=prizes.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [prizes[i],prizes[j]]=[prizes[j],prizes[i]]; }
    const pickI=+b.dataset.i; const won=prizes[pickI].run(); S.gstats.chests++; sfx.coin(); sfx.catch(prizes[pickI].k==='big'?4:2);
    const labels=prizes.map(p=>p.k==='big'?'Big coin prize':p.k==='lure'?'Lure pack':'Lucky boost');
    $('evin').innerHTML=`<h3>${prizes[pickI].k==='big'?'Jackpot!':'Not bad!'}</h3><p class="sub">You got: <b>${esc(won)}</b></p><div class="badges" style="margin:10px 0">${labels.map((l,i)=>`<span class="badge ${i===pickI?'g':''}">Chest ${i+1}: ${l}</span>`).join('')}</div><button class="btn" data-ev="skip">Keep fishing</button>`;
    renderBait(); checkFeats(); save(); lastHud=''; return; } });
function updateEvents(dt){
  if(G.st==='frenzy' && G.fz){ const fz=G.fz; fz.t+=dt; fz.next-=dt; if(fz.next<=0 && fz.t<fz.dur-.8){ fz.next=rnd(.25,.5); const pool=SP.filter(s=>s.loc===S.loc&&s.r<=1); fz.jumpers.push({p:rnd(.15,.98), t:0, dur:rnd(1.1,1.7), h:rnd(.1,.24), sp:pick(pool), hit:0}); }
    for(const j of fz.jumpers) j.t+=dt; fz.jumpers=fz.jumpers.filter(j=>j.t<j.dur && !(j.hit && j.t-j.hit>.4));
    if(fz.t>=fz.dur){ const each=bestLoot()*.25; const coins=earn(fz.caught*each*coinMult()); S.gstats.frenzy++; S.gstats.frenzyFish+=fz.caught; G.st='idle'; G.fz=null; sfx.catch(fz.caught>=10?4:2);
      toast('Frenzy over: '+fz.caught+' fish, +'+fmt(coins)+' coins'); checkFeats(); save(); lastHud=''; } }
  if(G.star){ G.star.t+=dt; if(G.star.t>G.star.dur) G.star=null; }
  else if(nightness(phase())>.7 && (G.st==='idle'||G.st==='waiting') && Math.random()<dt/80){ G.star={x0:rnd(.3,.9)*W, y0:rnd(.04,.16)*H, t:0, dur:2.8}; }
}
function jumperPos(j){ const k=j.t/j.dur; const x=castX(j.p)+ (k-.5)*30, y=waterY(castX(j.p)) - Math.sin(k*Math.PI)*H*j.h; return {x,y,k}; }
function starPos(){ const s=G.star, k=s.t/s.dur; return {x:s.x0-k*W*.35, y:s.y0+k*H*.12, k}; }
function canvasXY(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function frenzyHit(e){ if(!e||!G.fz) return; const m=canvasXY(e); let best=null, bd=38*38; for(const j of G.fz.jumpers){ if(j.hit) continue; const p=jumperPos(j); const d=(p.x-m.x)**2+(p.y-m.y)**2; if(d<bd){ bd=d; best=j; } }
  if(best){ best.hit=best.t; G.fz.caught++; const p=jumperPos(best); splash(p.x,p.y,10); tone(900+G.fz.caught*30,.08,'triangle',.06); } }
function starHit(e){ if(!e||!G.star) return false; const m=canvasXY(e), p=starPos(); if((p.x-m.x)**2+(p.y-m.y)**2>44*44) return false;
  const fo=pick(FORTUNES); addBuff(fo[1],fo[2],10,'Falling star'); S.gstats.stars++; G.star=null; sfx.shiny(); toast('You caught a falling star! Your wish: '+fmtB(fo[1],fo[2])+' for 10 min'); checkFeats(); save(); lastHud=''; return true; }
function drawEvents(t){
  if(G.star){ const p=starPos(); const a=Math.sin(p.k*Math.PI); const gr=g.createLinearGradient(p.x,p.y,p.x+70,p.y-24); gr.addColorStop(0,'rgba(255,245,200,'+a+')'); gr.addColorStop(1,'rgba(255,245,200,0)'); g.strokeStyle=gr; g.lineWidth=3; g.beginPath(); g.moveTo(p.x,p.y); g.lineTo(p.x+70,p.y-24); g.stroke(); g.fillStyle='rgba(255,250,220,'+a+')'; g.beginPath(); g.arc(p.x,p.y,3.5,0,7); g.fill(); }
  if(G.st==='frenzy' && G.fz){ for(const j of G.fz.jumpers){ const p=jumperPos(j); g.save(); g.translate(p.x,p.y); if(j.hit){ g.globalAlpha=Math.max(0,1-(j.t-j.hit)/.4); g.fillStyle='#ffc94d'; g.font='800 16px system-ui'; g.textAlign='center'; g.fillText('+1',0,-14-(j.t-j.hit)*40); }
      else { g.rotate(-Math.cos(p.k*Math.PI)*.9); drawCreature(g,j.sp,0,0,30,{wag:t*20,flip:true}); } g.restore(); } } }
function drawFrenzyHUD(t){ const fz=G.fz; if(!fz) return; const left=Math.max(0,fz.dur-fz.t); const txt='Fish frenzy  ·  '+fz.caught+' caught  ·  '+left.toFixed(1)+' s'; g.font='800 15px "Bricolage Grotesque", system-ui'; const tw=g.measureText(txt).width;
  g.fillStyle='rgba(5,14,20,.78)'; rr(W/2-tw/2-14,12,tw+28,30,15); g.fill(); g.fillStyle='#ffc94d'; g.textAlign='center'; g.fillText(txt,W/2,32); }

// ---------- boardwalk: wheel, crates, coin flip, scratch card ----------
const WHEEL = [['Coins ×2',22,'#3a6f9a'],['Seashell',16,'#6a7680'],['Lure pack',14,'#4f8a4a'],['Coins ×6',12,'#7a4a9a'],['Lucky boost',12,'#2a8aa8'],['Small crate',10,'#c8553a'],['Big crate',4,'#d87aa0'],['JACKPOT ×40',2,'#d8a020']];
const WHEEL_FREE_MS = 4*3600*1000;
const wheelCost = () => Math.round(bestLoot()*3);
const crateCost = k => Math.round(bestLoot()*({small:5,big:25,legend:120}[k]));
let WH={angle:0, spinning:false, result:''}, crateRes=null, flipRes=null, scratch=null;
function drawWheel(){ const c=$('wheelcv'); if(!c) return; const x=c.getContext('2d'), w=c.width, r=w/2-14; x.clearRect(0,0,w,w); x.save(); x.translate(w/2,w/2);
  const tot=WHEEL.reduce((a,s)=>a+s[1],0); let a0=WH.angle; for(const s of WHEEL){ const a1=a0+s[1]/tot*Math.PI*2; x.fillStyle=s[2]; x.beginPath(); x.moveTo(0,0); x.arc(0,0,r,a0,a1); x.closePath(); x.fill(); x.strokeStyle='#0a161d'; x.lineWidth=3; x.stroke();
    x.save(); x.rotate((a0+a1)/2); x.fillStyle='#fff'; x.font='700 '+(w/24|0)+'px system-ui'; x.textAlign='right'; x.fillText(s[0],r-12,6); x.restore(); a0=a1; }
  x.fillStyle='#0a161d'; x.beginPath(); x.arc(0,0,w*.08,0,7); x.fill(); x.fillStyle='#ffc94d'; x.beginPath(); x.arc(0,0,w*.05,0,7); x.fill(); x.restore();
  x.fillStyle='#ff6a3d'; x.beginPath(); x.moveTo(w/2-16,4); x.lineTo(w/2+16,4); x.lineTo(w/2,34); x.closePath(); x.fill(); }
function spinWheel(paid){ if(WH.spinning) return; const tot=WHEEL.reduce((a,s)=>a+s[1],0); let x=Math.random()*tot, idx=0; for(let i=0;i<WHEEL.length;i++){ x-=WHEEL[i][1]; if(x<=0){ idx=i; break; } }
  let start=0; for(let i=0;i<idx;i++) start+=WHEEL[i][1]/tot*Math.PI*2; const mid=start+WHEEL[idx][1]/tot*Math.PI*2*rnd(.2,.8);
  const target = -Math.PI/2 - mid; const from=WH.angle; let to=target; while(to<from+Math.PI*8) to+=Math.PI*2;
  WH.spinning=true; WH.result=''; const t0=performance.now(), dur=3800; let lastTick=0;
  const step=()=>{ const k=Math.min(1,(performance.now()-t0)/dur), e=1-Math.pow(1-k,3.4); WH.angle=from+(to-from)*e; drawWheel(); const seg=Math.floor(WH.angle/(Math.PI/6)); if(seg!==lastTick){ lastTick=seg; tone(1500,.02,'square',.02); }
    if(k<1) (window.requestAnimationFrame||setTimeout)(step,16); else { WH.spinning=false; WH.angle%=Math.PI*2; WH.result=wheelPrize(idx); S.gstats.spins++; checkFeats(); save(); lastHud=''; if(S.tab==='games') renderPanel(); } };
  step(); }
function wheelPrize(i){ const base=bestLoot(); sfx.coin();
  switch(i){
    case 0: return '+'+fmt(earn(base*2*coinMult()))+' coins';
    case 1: return 'A pretty seashell. Worth nothing, but it’s nice.';
    case 2: { const opts=Object.keys(BAIT).filter(k=>k!=='worm'&&!BAIT[k].junk); const k=pick(opts); S.bait[k]+=8; renderBait(); return '8 '+BAIT[k].name; }
    case 3: return '+'+fmt(earn(base*6*coinMult()))+' coins';
    case 4: { const fo=pick(FORTUNES); addBuff(fo[1],fo[2],15,'Lucky wheel'); return 'Boost: '+fmtB(fo[1],fo[2])+' for 15 min'; }
    case 5: S.tokens.small++; return 'A small Mystery Crate (open it below)';
    case 6: S.tokens.big++; return 'A BIG Mystery Crate (open it below)';
    default: sfx.shiny(); return 'JACKPOT! +'+fmt(earn(base*40*coinMult()))+' coins';
  } }
function openCrate(k){ const base=bestLoot(); const r=Math.random(); let res={title:'',draw:null};
  const petPool=tier=>PETS.filter(p=>p.src==='crate' && p.price<=tier && !S.owned.pets.includes(p.id));
  const cosmetic=()=>{ const pool=[...SHOP_COLS.filter(c=>!S.owned.cols.includes(c[0])).map(c=>['col',c[0],c[1]]), ...PATTERNS.filter(p=>p[2]&&!S.owned.pats.includes(p[0])).map(p=>['pat',p[0],p[1]+' shirt']), ...HATS.filter(h=>h.src==='shop'&&!S.owned.hats.includes(h.id)).map(h=>['hat',h.id,h.name])]; if(!pool.length) return null;
    const it=pick(pool); if(it[0]==='col') S.owned.cols.push(it[1]); else if(it[0]==='pat') S.owned.pats.push(it[1]); else S.owned.hats.push(it[1]); return {title:'New '+(it[0]==='hat'?'hat':'clothing')+': '+it[2], kind:it[0], id:it[1]}; };
  const decor=(rare)=>{ const pool=DECOR.filter(d=>!S.aq.owned.includes(d.id) && (rare ? true : d.price>0)); if(!pool.length) return null; const d=rare && pool.some(x=>!x.price) && Math.random()<.6 ? pick(pool.filter(x=>!x.price)) : pick(pool); S.aq.owned.push(d.id); return {title:'Aquarium decor: '+d.name+' (+'+Math.round(d.b*100)+'% income)', kind:'decor', id:d.id}; };
  const pet=(tier,legendBias)=>{ let pool=petPool(tier); if(legendBias){ const top=pool.filter(p=>p.price===3); if(top.length && Math.random()<.35) pool=top; } if(!pool.length) return null; const p=pick(pool); S.owned.pets.push(p.id); return {title:'New pet: '+p.name+'!', kind:'pet', id:p.id}; };
  const coins=(a,b)=>({title:'+'+fmt(earn(base*rnd(a,b)*coinMult()))+' coins', kind:'coins'});
  const lure=()=>{ const opts=Object.keys(BAIT).filter(x=>x!=='worm'); const kk=pick(opts); const n=BAIT[kk].junk?4:10; S.bait[kk]+=n; renderBait(); return {title:n+' '+BAIT[kk].name, kind:'lure'}; };
  if(k==='small') res = r<.4?coins(2,9) : r<.62?lure() : r<.8?(cosmetic()||coins(3,8)) : r<.92?(decor(false)||coins(3,8)) : (pet(1)||coins(6,12));
  else if(k==='big') res = r<.25?coins(15,45) : r<.45?(cosmetic()||coins(15,40)) : r<.65?(decor(false)||coins(15,40)) : r<.92?(pet(2)||coins(25,50)) : (decor(true)||coins(25,50));
  else res = r<.45?(pet(3,true)||coins(150,300)) : r<.75?(decor(true)||coins(150,300)) : coins(100,300);
  S.gstats.crates++; sfx.catch(k==='legend'?4:k==='big'?3:2); if(res.kind==='pet'||res.kind==='decor') sfx.shiny(); crateRes=Object.assign({crate:k},res); }
function newScratch(){ const sym=['🐟','🦀','🐚','💎','👑'], prize=[2,4,8,20,60], ws=[50,25,15,8,2]; const win=Math.random()<.35; let w=-1; if(win){ let x=Math.random()*100; w=0; for(let i=0;i<5;i++){ x-=ws[i]; if(x<=0){ w=i; break; } } }
  const cells=[]; if(win) cells.push(w,w,w); const cnt=[0,0,0,0,0]; if(win) cnt[w]=3; while(cells.length<9){ const s=Math.floor(Math.random()*5); if(s===w || cnt[s]>=2) continue; cnt[s]++; cells.push(s); }
  for(let i=cells.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cells[i],cells[j]]=[cells[j],cells[i]]; }
  scratch={cells, open:Array(9).fill(false), win:w, prize:w>=0?Math.round(bestLoot()*prize[w]*coinMult()):0, done:false, sym}; }
function renderGames(P){ const free=Date.now()-S.wheelT>=WHEEL_FREE_MS, wait=Math.ceil((WHEEL_FREE_MS-(Date.now()-S.wheelT))/1000); const tk=S.tokens; const base=bestLoot();
  const crateRow=(k,name,desc)=>`<div class="row spread" style="padding:6px 0;border-bottom:1px solid var(--line)"><div style="min-width:0"><b>${name}</b>${tk[k]?` <span class="badge g">${tk[k]} free</span>`:''}<div class="meta">${desc}</div></div>
    ${tk[k]?`<button class="btn sm" data-act="crate" data-k="${k}" data-free="1">Open free</button>`:`<button class="btn sm" data-act="crate" data-k="${k}" ${S.money>=crateCost(k)?'':'disabled'}>Open · <span class="coin">${fmt(crateCost(k))}</span></button>`}</div>`;
  const betBtn=f=>{ const amt=Math.min(Math.floor(S.money*f), base*60); return `<button class="btn alt sm" data-act="flip" data-k="${f}" ${amt>=10?'':'disabled'}>Bet ${Math.round(f*100)}% · <span class="coin">${fmt(Math.max(0,amt))}</span></button>`; };
  P.innerHTML=`<h2>Boardwalk</h2><p class="sub">Games of chance on the pier, for coins only. Prices grow with the best water you’ve unlocked. Angler ranks hand out free crates.</p>
  <div class="grid">
   <div class="tile"><h4>Lucky wheel</h4><div class="wheelwrap"><canvas id="wheelcv" width="520" height="520"></canvas>
     ${free?`<button class="btn" data-act="spin" data-k="free" ${WH.spinning?'disabled':''}>Free spin!</button>`:`<button class="btn" data-act="spin" ${WH.spinning||S.money<wheelCost()?'disabled':''}>Spin · <span class="coin">${fmt(wheelCost())}</span></button><span class="meta">Next free spin in ${Math.floor(wait/3600)?Math.floor(wait/3600)+' h ':''}${Math.ceil(wait%3600/60)} min</span>`}
     ${WH.result?`<div class="val" style="text-align:center">${esc(WH.result)}</div>`:''}</div></div>
   <div class="tile"><h4>Mystery crates</h4><div class="meta">Coins, lures, clothes, aquarium decor, and pets you can’t get anywhere else.</div>
     ${crateRow('small','Small crate','Mostly coins and lures. Sometimes a pet.')}${crateRow('big','Big crate','Clothes, decor, and the rarer pets.')}${crateRow('legend','Legendary crate','Dragons, unicorns, crystal caves.')}
     ${crateRes?`<div class="reveal" style="text-align:center;margin-top:8px"><canvas width="240" height="180" id="crateprev"></canvas><div class="val">${esc(crateRes.title)}</div></div>`:''}</div>
   <div class="tile"><h4>Coin flip with the Fishmonger</h4><div class="meta">Heads you double it, tails he keeps it. A fair coin, he swears.</div>
     <div class="row">${betBtn(.1)}${betBtn(.25)}${betBtn(.5)}</div>${flipRes?`<div class="val" style="font-size:18px;color:${flipRes.win?'var(--gold)':'var(--muted)'}">${esc(flipRes.txt)}</div>`:''}
     <div class="meta">${S.gstats.flips} flips · ${S.gstats.flipWins} won</div></div>
   <div class="tile"><h4>Scratch card</h4><div class="meta">Find three of the same: 🐟 ×2 · 🦀 ×4 · 🐚 ×8 · 💎 ×20 · 👑 ×60 (times ${fmt(base)} coins).</div>
     ${scratch&&!scratch.done?`<div class="scratch">${scratch.cells.map((s,i)=>`<button data-act="scratch" data-i="${i}" class="${scratch.open[i]?'open':''}" aria-label="Scratch box ${i+1}">${scratch.open[i]?scratch.sym[s]:''}</button>`).join('')}</div><div class="row" style="justify-content:center"><button class="btn alt sm" data-act="scratchall">Reveal all</button></div>`
      :`${scratch&&scratch.done?`<div class="scratch">${scratch.cells.map(s=>`<button class="open" disabled>${scratch.sym[s]}</button>`).join('')}</div><div class="val" style="text-align:center;color:${scratch.win>=0?'var(--gold)':'var(--muted)'}">${scratch.win>=0?'Winner! +'+fmt(scratch.prize)+' coins':'No match this time.'}</div>`:''}
      <button class="btn" data-act="buyscratch" ${S.money>=base*2?'':'disabled'}>Buy a card · <span class="coin">${fmt(base*2)}</span></button>`}</div>
  </div>`;
  drawWheel(); const cp=$('crateprev'); if(cp&&crateRes){ const x=cp.getContext('2d'); const k=crateRes.kind;
    if(k==='pet') drawPet(x,crateRes.id,120,160,crateRes.id==='unicorn'?3.4:5,0); else if(k==='decor') drawDecor(x,crateRes.id,120,170,1.6,0); else if(k==='hat') hatPreview(x,240,180,crateRes.id,S.look.hatCol,true);
    else if(k==='col'){ x.fillStyle=crateRes.id; x.beginPath(); x.arc(120,90,50,0,7); x.fill(); } else drawJunk(x,240,180,k==='lure'?'goldlure':'chest'); } }
function settleScratch(){ if(!scratch||scratch.done) return; scratch.done=true; S.gstats.scratch++; if(scratch.win>=0){ earn(scratch.prize); S.gstats.scratchWins++; sfx.catch(scratch.win>=3?4:2); } else sfx.lost(); }

$('panel').addEventListener('input',e=>{ const el=e.target.closest('[data-set]'); if(!el) return; const k=el.dataset.set; S.settings[k]=(+el.value)/100; const v=$('setv_'+k); if(v) v.textContent=el.value+'%'; startAudio(); applyVolumes(); });
$('panel').addEventListener('change',e=>{ if(e.target.closest('[data-set]')) save(); });

// handles panel buttons added by the extras; returns 'skip' to avoid a full re-render
function extraAct(b){ const k=b.dataset.k, i=+b.dataset.i;
  switch(b.dataset.act){
    case 'tog': S.settings[k]=!S.settings[k]; applyVolumes(); if(k==='musicOn'||k==='ambient') startAudio(); return;
    case 'mstyle': S.settings.style=k; return;
    case 'fullscreen': { const d=document; try{ if(d.fullscreenElement) d.exitFullscreen(); else d.documentElement.requestFullscreen(); }catch(e){} return 'skip'; }
    case 'spin': { const freeSpin=k==='free' && Date.now()-S.wheelT>=WHEEL_FREE_MS; if(!freeSpin){ const c=wheelCost(); if(S.money<c) return 'skip'; S.money-=c; } else S.wheelT=Date.now(); b.disabled=true; spinWheel(!freeSpin); lastHud=''; return 'skip'; }
    case 'crate': { if(b.dataset.free){ if(S.tokens[k]<=0) return; S.tokens[k]--; } else { const c=crateCost(k); if(S.money<c) return; S.money-=c; } openCrate(k); return; }
    case 'flip': { const amt=Math.min(Math.floor(S.money*(+k)), bestLoot()*60); if(amt<10) return; S.money-=amt; S.gstats.flips++; flipRes={txt:'The coin spins…'}; renderPanel(); tone(1200,.05,'square',.03);
      setTimeout(()=>{ const win=Math.random()<.5; if(win){ S.money+=amt*2; S.stats.earned+=amt; S.gstats.flipWins++; sfx.coin(); } else sfx.lost(); flipRes={win, txt: win?'Heads! You win '+fmt(amt)+' coins':'Tails. The Fishmonger pockets '+fmt(amt)+' coins'}; checkFeats(); save(); lastHud=''; if(S.tab==='games') renderPanel(); }, 900); return 'skip'; }
    case 'buyscratch': { const c=bestLoot()*2; if(S.money<c) return; S.money-=c; newScratch(); return; }
    case 'scratch': { if(!scratch||scratch.done) return; scratch.open[i]=true; tone(2000+Math.random()*500,.03,'square',.02); const opened=scratch.cells.filter((s,j)=>scratch.open[j]);
      const cnt={}; opened.forEach(s=>cnt[s]=(cnt[s]||0)+1); if(Object.values(cnt).some(n=>n>=3) || scratch.open.every(x=>x)) settleScratch(); return; }
    case 'scratchall': if(scratch){ scratch.open.fill(true); settleScratch(); } return;
    case 'feed': { if(Date.now()-S.fedT<3600000) return; S.fedT=Date.now(); addBuff('tank',.25,30,'Fed fish'); feedAnim=performance.now(); sfx.coin(); toast('Your fish are happy: +25% aquarium income for 30 min'); return; }
    case 'aqtheme': { const th=THEMES.find(x=>x[0]===k); if(!th) return; if(!S.aq.owned.includes(k)){ if(S.money<th[2]) return; S.money-=th[2]; S.aq.owned.push(k); sfx.coin(); } S.aq.theme=k; return; }
    case 'aqsand': { const sd=SANDS.find(x=>x[0]===k); if(!sd) return; if(!S.aq.owned.includes(k)){ if(S.money<sd[2]) return; S.money-=sd[2]; S.aq.owned.push(k); sfx.coin(); } S.aq.sand=k; return; }
    case 'decor': { const d=DECORI[k]; if(!d) return; if(!S.aq.owned.includes(k)){ if(!d.price||S.money<d.price) return; S.money-=d.price; S.aq.owned.push(k); sfx.coin(); }
      if(S.aq.decor.includes(k)) S.aq.decor=S.aq.decor.filter(x=>x!==k); else if(S.aq.decor.length<aqSlots()) S.aq.decor.push(k); else toast('All decoration spots are used. Remove one first, or build more tanks.'); return; }
  }
  return 'skip'; }
function aqCustomHTML(){ const fedLeft=Math.max(0,3600000-(Date.now()-S.fedT));
  const chip=(act,list,cur)=>list.map(x=>{ const own=S.aq.owned.includes(x[0]); return `<button class="chipb" data-act="${act}" data-k="${x[0]}" aria-pressed="${cur===x[0]}" ${!own&&S.money<x[2]?'disabled':''}><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${x[3]};margin-right:6px;vertical-align:-1px"></span>${x[1]}${own?'':' · '+fmt(x[2])}</button>`; }).join('');

function mv(type,f,t,dur,peak,att,outs,det=0){ const o=AC.createOscillator(), gn=AC.createGain(); o.type=type; o.frequency.value=f; if(det) o.detune.value=det; gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(peak,t+att); gn.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(gn); outs.forEach(x=>gn.connect(x)); o.start(t); o.stop(t+dur+.05); return o; }

function musicTick(){ if(!AC||!MUS.n) return; const n=MUS.n, now=AC.currentTime;

  n.windg.gain.setTargetAtTime(L.id==='frost'?.05:L.id==='deep'?.02:0, now, 1.5);

    if(night<.4 && ['pond','river','reef','coast'].includes(L.id) && r<.012){ const t=now+.05; for(let i=0;i<2+Math.floor(Math.random()*3);i++){ const o=mv('sine',2600+Math.random()*900,t+i*.11,.09,.025,.01,[BUS.amb]); o.frequency.exponentialRampToValueAtTime(3600+Math.random()*600,t+i*.11+.07); } }

const bountySlots = () => 3 + Math.min(2, Math.floor((S.unlocked.length-1)/3));
function makeBounty(){
  if(Math.random()<.08){ const lp=SP.filter(s=>S.unlocked.includes(s.loc)&&s.r===4); if(lp.length){ const sp=pick(lp); return {sp:sp.id, type:'count', n:1, have:0, reward:Math.round(sp.base*3), legend:1}; } }
  const cap = Math.random()<.12 ? 3 : Math.random()<.3 ? 2 : 1;
  const pool=SP.filter(s=>S.unlocked.includes(s.loc) && s.r <= cap); const locBias = pool.filter(s=>s.loc===S.unlocked[S.unlocked.length-1]);
  const sp = pick(locBias.length && Math.random()<.6 ? locBias : pool);
  if(Math.random()<.55){ const n = sp.r===0 ? 2+Math.floor(Math.random()*3) : sp.r>=3 ? 1 : 1+Math.floor(Math.random()*2); return {sp:sp.id, type:'count', n, have:0, reward:Math.round(sp.base*n*2.4+20)}; }
  const kg = +(sp.min+(sp.max-sp.min)*rnd(.45,.7)).toFixed(sp.max<10?2:1); return {sp:sp.id, type:'size', kg, have:0, reward:Math.round(sp.base*4+30)};
}
function fillBounties(){ while(S.bounties.length<bountySlots()) S.bounties.push(makeBounty()); }
function bDone(b){ return b.type==='count' ? b.have>=b.n : b.have>=1; }
function checkBounties(sp,kg){ const done=[]; for(const b of S.bounties){ if(b.sp!==sp.id || bDone(b)) continue; if(b.type==='count'){ b.have++; } else if(kg>=b.kg){ b.have=1; } if(bDone(b)) done.push(b); } return done; }

  <div class="stylewrap"><div class="preview"><canvas id="lookcv" width="520" height="560"></canvas></div><div>
    <h5>Body</h5><div class="chips"><button class="chipb" data-act="look" data-k="g" data-v="m" aria-pressed="${lk.g==='m'}">Man</button><button class="chipb" data-act="look" data-k="g" data-v="f" aria-pressed="${lk.g==='f'}">Woman</button></div>
    <h5>Skin</h5>${sw('skin',SKINS.map((_,i)=>i)).replace(/data-v="(\d)"([^>]*)style="background:\d"/g,(m,i,mid)=>`data-v="${i}"${mid}style="background:${SKINS[i]}"`).replace(/aria-pressed="(true|false)"/g,(m)=>m)}
    <h5>Hair</h5>${sw('hair',HAIRS.map((_,i)=>i)).replace(/data-v="(\d)"([^>]*)style="background:\d"/g,(m,i,mid)=>`data-v="${i}"${mid}style="background:${HAIRS[i]}"`)}
    <h5>Shirt colour</h5>${sw('shirt',cols)}<h5>Shirt pattern</h5><div class="chips">${pats}</div>
    <h5>Trousers</h5>${sw('pants',cols)}
    <h5>Hat</h5><div class="hatgrid">${hats}</div>
    <h5>Hat colour ${HATI[lk.hat]&&HATI[lk.hat].fixed?'<span style="text-transform:none;letter-spacing:0">(this hat keeps its own colours)</span>':''}</h5>${sw('hatCol',cols)}
  </div></div>
  <div class="jsec"><div class="row spread"><h2>Clothing shop</h2><span class="sub">New stock in <b id="shopleft">${mmss(Math.ceil(SHOP_LEN-(Date.now()/1000%SHOP_LEN)))}</b></span></div><div class="grid">${offers}</div></div>`;
  P.querySelectorAll('.sw[data-k="skin"],.sw[data-k="hair"]').forEach(b=>{ b.setAttribute('aria-pressed', String(String(lk[b.dataset.k])===b.dataset.v)); });
  drawLookPreview();
  P.querySelectorAll('canvas[data-hat]').forEach(c=>{ const cx=c.getContext('2d'); cx.clearRect(0,0,c.width,c.height); hatPreview(cx,c.width,c.height,c.dataset.hat,lk.hatCol); });
  P.querySelectorAll('canvas[data-offer]').forEach(c=>{ const [kind,id]=c.dataset.offer.split(':'); const cx=c.getContext('2d'); cx.clearRect(0,0,128,128);
    if(kind==='col'){ cx.fillStyle=id; cx.beginPath(); cx.arc(64,64,42,0,7); cx.fill(); cx.strokeStyle='#23434e'; cx.lineWidth=3; cx.stroke(); }
    else if(kind==='pat'){ cx.save(); cx.translate(64,20); cx.scale(4,4); cx.fillStyle=lk.shirt; cx.beginPath(); cx.moveTo(-9,0); cx.lineTo(9,0); cx.lineTo(8,24); cx.lineTo(-8,24); cx.closePath(); cx.fill(); cx.clip(); drawPattern(cx,id,lk.shirt,-10,-1,20,26); cx.restore(); }
    else hatPreview(cx,128,128,id,lk.hatCol); });
}
function drawLookPreview(){ const c=$('lookcv'); if(!c) return; const cx=c.getContext('2d'); cx.clearRect(0,0,c.width,c.height);
  cx.fillStyle='#6b4a2e'; cx.fillRect(0,470,520,22); cx.fillStyle='#4a3220'; cx.fillRect(60,492,20,70); cx.fillRect(420,492,20,70); cx.fillStyle='#7c5838'; for(let x=0;x<520;x+=40) cx.fillRect(x,470,3,22);
  drawPet(cx,S.pet,S.pet==='horse'?130:160,470,S.pet==='horse'?3.4:4,performance.now()/1000); drawAngler(cx,300,470,6.4,S.look,{t:performance.now()/1000}); }
// ---------- pets ----------
function renderPets(P){ const pp=PETI[S.pet];
  P.innerHTML=`<h2>Pets</h2><p class="sub">Your pet sits beside you wherever you fish and gives a bonus. Some are sold here, some are hiding in junk you fish up, and two join you after big feats. ${S.owned.pets.length} of ${PETS.length} found.</p>
  <div class="tile" style="margin-top:10px;flex-direction:row;align-items:center;gap:12px"><canvas width="160" height="120" id="petnow" style="width:80px;height:60px;cursor:default"></canvas><div><b>${pp.name} is with you</b><div class="meta">${pp.d} Bonus: <span class="aq">${fmtB(pp.k,petVal())}</span></div></div></div>
  <div class="grid">`+PETS.map(p=>{ const own=S.owned.pets.includes(p.id), here=S.pet===p.id; const val=p.v*(1+.1*pr('petpal'));
    const act = here ? '<button class="btn alt" disabled>With you</button>' : own ? `<button class="btn" data-act="pet" data-k="${p.id}">Bring along</button>`
      : p.src==='shop' ? `<button class="btn" data-act="buypet" data-k="${p.id}" ${S.money>=p.price?'':'disabled'}>Adopt · <span class="coin">${fmt(p.price)}</span></button>` : `<span class="meta">${esc(p.d)}</span>`;
    return `<div class="tile ${here?'done':''}"><canvas width="240" height="140" data-pet="${p.id}" data-own="${own?1:0}" style="width:120px;height:70px;cursor:default"></canvas><h4>${own||p.src==='shop'?p.name:'???'}</h4>
      <div class="meta">${own||p.src==='shop'?esc(p.d)+' ':''}<span class="aq">${fmtB(p.k,val)}</span></div>${act}</div>`; }).join('')+'</div>';
  const pc=$('petnow'); if(pc){ const cx=pc.getContext('2d'); drawPet(cx,S.pet,80,110,S.pet==='horse'?2.2:4,0); }
  P.querySelectorAll('canvas[data-pet]').forEach(c=>{ const cx=c.getContext('2d'); cx.clearRect(0,0,c.width,c.height); if(c.dataset.own==='1'||PETI[c.dataset.pet].src==='shop') drawPet(cx,c.dataset.pet,120,128,c.dataset.pet==='horse'?2.6:4.4,0);
    else { cx.globalAlpha=.9; cx.filter='brightness(0) opacity(.5)'; drawPet(cx,c.dataset.pet,120,128,c.dataset.pet==='horse'?2.6:4.4,0); cx.filter='none'; cx.globalAlpha=1; } });
}

// ---------- save codes ----------
let pendingLoad=null;
async function makeCode(){ const json=JSON.stringify(S);
  try{ if(window.CompressionStream){ const st=new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw')); const buf=new Uint8Array(await new Response(st).arrayBuffer()); let bin=''; for(let i=0;i<buf.length;i+=0x8000) bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000)); return 'DL1:'+btoa(bin); } }catch(e){}
  return 'DL0:'+btoa(unescape(encodeURIComponent(json))); }
async function readCode(code){ code=String(code).trim().replace(/\s+/g,''); const tag=code.slice(0,4), bin=atob(code.slice(4));
  if(tag==='DL1:'){ const u=Uint8Array.from(bin,ch=>ch.charCodeAt(0)); const st=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return JSON.parse(await new Response(st).text()); }
  if(tag==='DL0:') return JSON.parse(decodeURIComponent(escape(bin))); throw new Error('not a Driftline code'); }
function renderSave(P){ const isApp=window.matchMedia && matchMedia('(display-mode: standalone)').matches;
  P.innerHTML=`<h2>Save and load</h2><p class="sub">Your progress saves by itself on this device. To move it to another phone or computer, copy your save code here and load it on the other one.</p>
  <div class="grid"><div class="tile"><h4>Your save code</h4><div class="meta">Level ${S.lvl} · ${fmt(S.money)} coins · ${Object.keys(S.journal).length} species · last saved ${S.savedAt?new Date(S.savedAt).toLocaleString():'never'}</div>
    <textarea id="savecode" readonly rows="4" aria-label="Your save code">Making your code…</textarea><div class="row"><button class="btn" data-act="copysave">Copy save code</button></div></div>
  <div class="tile"><h4>Load a save code</h4><div class="meta">Paste a code from another device. It replaces the progress on this one.</div><textarea id="loadcode" rows="4" placeholder="Paste a code that starts with DL" aria-label="Save code to load"></textarea>
    ${pendingLoad?`<div class="meta" style="color:var(--danger)">Replace this device’s progress with level ${pendingLoad.lvl}, ${fmt(pendingLoad.money||0)} coins, ${Object.keys(pendingLoad.journal||{}).length} species?</div><div class="row"><button class="btn" data-act="loadok" style="background:var(--danger)">Replace progress</button><button class="btn alt" data-act="cancel">Cancel</button></div>`
    :`<div class="row"><button class="btn alt" data-act="loadsave">Load code</button></div>`}</div>
  ${window.DL_DESKTOP?'<div class="tile"><h4>Desktop app</h4><div class="meta">You’re playing the Driftline desktop app. It updates itself and keeps your progress on this PC.</div></div>':''}
  ${window.DL_VERSION&&!window.DL_DESKTOP?'<div class="tile"><h4>Windows desktop app</h4><div class="meta">A real program with its own window and Start-menu icon. Updates itself.</div><a class="btn" href="download/Driftline-Setup.zip" download style="text-decoration:none;text-align:center">Download for Windows</a><div class="meta">Unzip it and run <b>Driftline.exe</b>. If Windows shows “protected your PC”, click <b>More info</b>, then <b>Run anyway</b>. Your browser progress doesn’t carry over automatically: copy a save code here and load it in the app.</div></div>':''}
  ${window.DL_VERSION&&!window.DL_DESKTOP?'':'<!--'}<div class="tile"><h4>Install as an app</h4><div class="meta">${isApp?'You are playing the installed app. It updates itself when a new version is out.':'Get a home-screen icon, full-screen play and offline fishing. It updates itself.'}</div>
    ${isApp?'':window.__dlInstallPrompt?'<button class="btn" data-act="install">Install Driftline</button>':'<div class="meta">iPhone: Share, then <b>Add to Home Screen</b>. Android, Windows or Mac in Chrome or Edge: the install icon in the address bar, or the menu, then <b>Install</b>.</div>'}</div>${window.DL_VERSION&&!window.DL_DESKTOP?'':'-->'}</div>
  ${window.DL_VERSION?`<p class="sub" style="margin-top:10px">Version ${esc(window.DL_VERSION)}</p>`:''}`;
  makeCode().then(c=>{ const t=$('savecode'); if(t) t.value=c; }); }

$('panel').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const k=b.dataset.k, i=+b.dataset.i;
  switch(b.dataset.act){
    case 'copysave': { const t=$('savecode'); if(!t||!t.value.startsWith('DL')) return; (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('Save code copied')).catch(()=>{ t.focus(); t.select(); toast('Press Ctrl+C (or long-press, Copy) to copy the code'); }); return; }
    case 'loadsave': { const v=($('loadcode')||{}).value||''; readCode(v).then(o=>{ if(!o||typeof o!=='object'||!o.journal) throw 0; pendingLoad=o; renderPanel(); }).catch(()=>toast('That code didn’t work. Copy the whole thing and try again.')); return; }
    case 'loadok': { if(!pendingLoad) return; S=migrate(pendingLoad); pendingLoad=null; G.st='idle'; $('card').hidden=true; S.tab='save'; offlineIncome(); fillBounties(); toast('Progress loaded. Welcome back!'); break; }
    case 'install': { const ip=window.__dlInstallPrompt; if(!ip) return; ip.prompt(); ip.userChoice.finally(()=>{ window.__dlInstallPrompt=null; renderPanel(); }); return; }
    case 'sellall': { const sell=S.cooler.filter(f=>!isProtected(f)); if(!sell.length) return; const tot=earn(sell.reduce((a,f)=>a+salePrice(f),0)); S.cooler=S.cooler.filter(f=>isProtected(f)); sfx.coin(); toast('Sold '+sell.length+' fish for '+fmt(tot)+' coins'+(S.cooler.length?' (rare fish kept)':'')); break; }
    case 'sell': { const f=S.cooler[i]; if(!f) return; earn(salePrice(f)); S.cooler.splice(i,1); sfx.coin(); break; }
    case 'totank': { if(S.tank.length>=S.tankSlots) return; const f=S.cooler[i]; if(!f) return; accrue(); S.tank.push(f); S.cooler.splice(i,1); toast(SPI[f.id].name+' is on display'+(aqEff(f)?': '+aqTxt(f):'')); break; }
    case 'untank': { if(S.cooler.length>=gv('cooler')) return; const f=S.tank[i]; if(!f) return; accrue(); S.cooler.push(f); S.tank.splice(i,1); break; }
    case 'collect': { accrue(); const c=Math.floor(S.tankBank); if(c<1) return; earn(c); S.tankBank-=c; sfx.coin(); toast('Collected '+fmt(c)+' coins'); break; }
    case 'buytank': { const c=TANK_COST[S.tankSlots]; if(c==null||S.money<c) return; S.money-=c; S.tankSlots++; sfx.coin(); toast('New tank built'); break; }
    case 'perk': { const p=PERKS[k]; if(!p||ptsFree()<=0||pr(k)>=p.max) return; S.perks[k]=pr(k)+1; sfx.coin(); toast(p.name+' rank '+S.perks[k]); break; }
    case 'respec': { const c=50*S.lvl; if(S.money<c) return; S.money-=c; S.perks={}; toast('Skills reset. Points refunded.'); break; }
    case 'buygear': { const lv=S.gear[k], c=GEAR[k].cost[lv+1]; if(c==null||S.money<c) return; S.money-=c; S.gear[k]++; sfx.coin(); toast(GEAR[k].name+' upgraded to level '+(S.gear[k]+1)); break; }
    case 'buybait': { const bt=BAIT[k]; if(!bt||bt.junk||S.money<bt.price) return; S.money-=bt.price; S.bait[k]+=bt.pack; if(S.baitSel==='worm') S.baitSel=k; sfx.coin(); toast('Bought '+bt.pack+' '+bt.name); break; }
    case 'usebait': S.baitSel=k; break;
    case 'claim': { const bo=S.bounties[i]; if(!bo||!bDone(bo)) return; const paid=earn(bo.reward*coinMult()); S.bounties.splice(i,1); fillBounties(); sfx.coin(); toast('Bounty paid: '+fmt(paid)+' coins'); break; }
    case 'retire': { if(!canRetire()) return; confirmBox='retire'; break; }
    case 'reset': confirmBox='reset'; break;
    case 'cancel': confirmBox=null; pendingLoad=null; break;
    case 'retireok': { if(!canRetire()) return; const n=pearlsFor(); S.pearls+=n; S.tides++;
      Object.assign(S,{money:0, gear:fresh().gear, bait:baitZero(), baitSel:'worm', unlocked:['pond'], loc:'pond', cooler:[], bounties:[], setDone:{}, streak:0});
      S.stats.runEarned=0; confirmBox=null; fillBounties(); sfx.catch(4); toast('You set sail again with '+S.pearls+' Wisdom Pearls: +'+Math.round((coinMult()-1)*100)+'% coins and XP'); break; }
    case 'resetok': { S=fresh(); S.savedAt=Date.now(); confirmBox=null; G.st='idle'; encLoc=null; encSel=null; fillBounties(); toast('Progress reset. A fresh start at Willow Pond.'); break; }
    case 'reroll': { const bo=S.bounties[i]; const c=Math.ceil(bo.reward*.1); if(S.money<c) return; S.money-=c; S.bounties[i]=makeBounty(); break; }
    case 'unlock': { const L=LOCS[locIdx(k)]; if(S.money<L.cost) return; S.money-=L.cost; S.unlocked.push(k); S.loc=k; G.hot=null; fillBounties(); sfx.catch(2); toast('Welcome to '+L.name); break; }
    case 'goto': if(G.st!=='idle') return; S.loc=k; G.hot=null; toast('Travelled to '+LOCS[locIdx(k)].name); break;
    case 'encloc': encLoc=k; encSel=null; break;
    case 'enc': encSel = encSel===k ? null : k; break;
    case 'look': { const v=b.dataset.v; if(k==='skin'||k==='hair') S.look[k]=+v; else if(k==='hat'){ if(S.owned.hats.includes(v)) S.look.hat=v; } else if(k==='pat'){ if(S.owned.pats.includes(v)) S.look.pat=v; } else S.look[k]=v; break; }
    case 'buyoffer': { const [kind,id]=k.split(':'); const o=shopOffers().find(x=>x.kind===kind&&x.id===id); if(!o||ownedOffer(o)||S.money<o.price) return; S.money-=o.price; S.stats.bought++;
      if(kind==='col') S.owned.cols.push(id); else if(kind==='pat'){ S.owned.pats.push(id); S.look.pat=id; } else { S.owned.hats.push(id); S.look.hat=id; } sfx.coin(); toast('Bought '+o.name); break; }
    case 'pet': if(S.owned.pets.includes(k)){ S.pet=k; toast(PETI[k].name+' is coming with you'); } break;
    case 'buypet': { const p=PETI[k]; if(!p||p.src!=='shop'||S.owned.pets.includes(k)||S.money<p.price) return; S.money-=p.price; S.owned.pets.push(k); S.pet=k; sfx.coin(); toast('You adopted a '+p.name.toLowerCase()+'!'); break; }
    default: { if(extraAct(b)==='skip') return; }
  }
  checkFeats(); save(); refreshAll(); });

function renderBait(){ const sel=$('bait'); sel.innerHTML=Object.entries(BAIT).filter(([k])=>k==='worm'||S.bait[k]>0||S.baitSel===k||!BAIT[k].junk).map(([k,b])=>`<option value="${k}" ${S.baitSel===k?'selected':''} ${k!=='worm'&&S.bait[k]<=0?'disabled':''}>${b.name}${k==='worm'?'':' ('+S.bait[k]+')'}</option>`).join(''); }
$('bait').addEventListener('change',e=>{ S.baitSel=e.target.value; e.target.blur(); save(); if(S.tab==='shop') renderPanel(); });
$('settingsbtn').addEventListener('click',e=>{ e.currentTarget.blur(); startAudio(); setTab('settings'); $('panel').scrollIntoView({behavior:'smooth',block:'start'}); });
function refreshAll(){ lastHud=''; renderBait(); setTab(S.tab||'cooler'); hud(); }

// ---------- boot ----------
offlineIncome(); fillBounties(); checkFeats(); refreshAll(); requestAnimationFrame(frame); initCloud();
if(!S.stats.caught && !S.savedAt) setTimeout(()=>toast('Hold on the water to cast your first line'),600);
})();
</script>

<div id="updbar" hidden style="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:flex;gap:10px;align-items:center;background:#10222b;border:1px solid #ffc94d;color:#e6efe8;padding:8px 10px 8px 16px;border-radius:999px;font:700 14px system-ui,sans-serif;box-shadow:0 10px 30px #0008;max-width:calc(100% - 32px)">
  A new version of Driftline is ready
  <button id="updbtn" type="button" style="background:#ff6a3d;color:#1d0d06;border:0;border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer">Update</button>
</div>
<script>
(function(){
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(function(){});
  function check(){
    fetch('version.txt', {cache:'no-store'}).then(function(r){ return r.ok ? r.text() : ''; }).then(function(v){
      v = (v || '').trim(); if (v && v !== window.DL_VERSION) document.getElementById('updbar').hidden = false;
    }).catch(function(){});
  }
  setInterval(check, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) check(); });
  document.getElementById('updbtn').onclick = function(){
    var go = function(){ location.reload(); };
    fetch('./', {cache:'reload'}).then(go, go);
  };
})();
</script>
