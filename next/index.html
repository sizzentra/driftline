window.DL_PREVIEW=true; window.DL_VERSION='2026.11.16-0952';

<body>
<title>Driftline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: HUD strip, the scene (canvas), then a tabbed tackle-box panel. One committed dusk-water look. */
:root{
  color-scheme: dark;
  --bg:#0a161d; --panel:#10222b; --panel2:#152d37; --line:#23434e;
  --ink:#e6efe8; --muted:#8aa5a2; --buoy:#ff6a3d; --kelp:#7fc8a9; --gold:#ffc94d; --danger:#ff5468; --shiny:#ffe9a8;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
:fullscreen .wrap,.fs .wrap{max-width:none}
@media (min-width:1500px){body{font-size:16px}.stat b{font-size:17px}.tabs button{font-size:16px}}
/* boardwalk */
.bw-banner{position:relative;text-align:center;padding:26px 14px 14px;border-radius:14px;margin-bottom:12px;border:1px solid var(--line);overflow:hidden;
  background:repeating-linear-gradient(90deg,#c8553a 0 34px,#f4ece0 34px 68px);}
.bw-banner::after{content:"";position:absolute;inset:18px 0 0;background:linear-gradient(#10222bF2,#10222b);border-radius:12px 12px 0 0}
.bw-banner>*{position:relative;z-index:1}
.bw-banner h2{font-size:26px;letter-spacing:.02em;color:var(--gold);text-shadow:0 2px 0 #0008}
.bw-lights{position:absolute!important;left:0;right:0;top:4px;display:flex;justify-content:space-around;z-index:2!important}
.bw-lights i{width:9px;height:9px;border-radius:50%;background:#ffd84a;box-shadow:0 0 8px #ffd84a;animation:bulb 1.5s infinite}
@keyframes bulb{50%{background:#ff7a4a;box-shadow:0 0 10px #ff7a4a}}
@media (prefers-reduced-motion:reduce){.bw-lights i{animation:none}}
.bwt{position:relative;border-top:6px solid var(--c,#c8553a);background:linear-gradient(180deg,color-mix(in srgb,var(--c,#c8553a) 14%,var(--panel)),var(--panel) 60px)}
.wheelring{padding:8px;border-radius:50%;background:radial-gradient(circle,#0a161d 62%,#3a2a18 63%,#5a3a20 100%);box-shadow:0 0 0 3px #ffcc33,0 0 18px #ffcc3355}
.ducks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;padding:10px;border-radius:12px;background:linear-gradient(#2a8aa8,#1a5a78)}
.duckb{height:58px;border-radius:12px;border:0;background:transparent;font-size:34px;cursor:pointer;animation:bob 2s ease-in-out infinite}
.duckb.open,.duckb.picked{animation:none;font-size:16px;font-weight:700;background:#0a161d66;color:var(--ink)}
.duckb.picked{outline:2px solid var(--gold)}
@keyframes bob{50%{transform:translateY(-5px) rotate(4deg)}}
.hilocard{width:110px;height:140px;margin:10px auto;border-radius:12px;background:#f4ece0;color:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 20px #0006;border:3px solid #c8553a}
.hilocard b{font-family:var(--display);font-size:46px;line-height:1}
.hilocard span{font-size:13px;font-weight:700;color:#7a4a2a}
.spec{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;font:inherit;color:inherit}
.spec:hover:not(:disabled){border-color:var(--kelp)}
.spec.on{border-color:var(--gold);box-shadow:0 0 0 1px #ffc94d55;cursor:default}
.spec:disabled:not(.on){opacity:.6;cursor:not-allowed}
.spec b{font-family:var(--display);font-size:15px}
.spec .up{color:var(--kelp);font-size:13px}
.spec .down{color:#ff8a8a;font-size:13px}
/* 2.0 polish */
html,body{background:radial-gradient(1200px 600px at 50% -10%,#14303c 0%,#0a161d 60%) fixed,#0a161d}
.tile{background:linear-gradient(180deg,#132a34,#0f222b);box-shadow:0 1px 0 #ffffff08 inset,0 6px 18px #0004;transition:border-color .15s,transform .15s}
.tile:hover{border-color:#2f5866}
.btn{box-shadow:0 2px 0 #0003,0 4px 12px #ff6a3d22;transition:transform .12s,filter .12s}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.07)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.alt{box-shadow:0 2px 0 #0003}
.stat{background:linear-gradient(180deg,#14303a,#10222b)}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,#1c3d49,#152d37);box-shadow:0 0 0 1px #7fc8a944 inset}
.stage{box-shadow:0 10px 40px #0007}
h2{letter-spacing:-.01em}
.passtrack{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:12px}
.passcell{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:8px 6px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#132a34,#0f222b);font-size:12.5px}
.passcell canvas{width:72px;height:54px;cursor:default}
.passcell .lv{position:absolute;top:4px;left:7px;font-family:var(--display);font-weight:800;color:var(--muted)}
.passcell.special{border-color:#c38bff88}
.passcell.ready{border-color:var(--kelp);box-shadow:0 0 0 1px #7fc8a966,0 0 18px #7fc8a933}
.passcell.got{opacity:.6}
.pvbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 10px;margin-bottom:8px;border-radius:10px;background:#ffc94d1a;border:1px solid #ffc94d66;font-size:13.5px}
.prize{padding:6px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
/* HUD: fixed grid cells, so nothing appearing or changing inside it can move the game window */
.hud{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));align-items:stretch;gap:8px}
.hud>*{min-width:0;height:48px}
.hud .stat b,.hud .stat .lbl{overflow:hidden;text-overflow:ellipsis}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--buoy);box-shadow:0 0 0 3px #ff6a3d33;display:inline-block}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 11px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.stat b{font-family:var(--display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.coin::before{content:"";display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--gold);margin-right:5px;vertical-align:.02em;box-shadow:inset -2px -2px 0 #c9902a}
.xpbar{height:5px;border-radius:3px;background:#0a161d;margin-top:4px;overflow:hidden;min-width:90px}
.xpbar i{display:block;height:100%;background:var(--kelp);width:0}
.baitsel select{background:transparent;border:0;font-family:var(--display);font-weight:700;font-size:15px;padding:0;cursor:pointer;width:100%;min-width:0}
.baitsel select option{background:var(--panel)}
.ghost{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 12px;cursor:pointer;font-family:var(--display);font-weight:700}
.ghost:hover{border-color:var(--kelp)}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0d2430;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;cursor:pointer}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#0a161dE6;border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#05101580;padding:12px}
.card .in{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 20px;width:min(380px,100%);text-align:center;box-shadow:0 20px 50px #0008;animation:pop .28s ease-out;max-height:100%;overflow:auto}
.card .in.shiny{border-color:var(--gold);box-shadow:0 0 0 1px #ffc94d55,0 20px 60px #ffc94d33}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card .in{animation:none}}
.card canvas{width:220px;height:110px;margin:0 auto}
.card h3{font-family:var(--display);font-weight:800;font-size:23px;margin:2px 0 2px;text-wrap:balance}
.rar{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.card .nums{display:flex;justify-content:center;gap:18px;margin:8px 0;font-variant-numeric:tabular-nums}
.card .nums div{display:flex;flex-direction:column}
.card .nums span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.card .nums b{font-family:var(--display);font-size:19px}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:4px}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#ff6a3d22;color:var(--buoy);border:1px solid #ff6a3d55}
.badge.g{background:#ffc94d1f;color:var(--gold);border-color:#ffc94d55}
.badge.k{background:#7fc8a91f;color:var(--kelp);border-color:#7fc8a955}
.card .tap{color:var(--muted);font-size:13px;margin-top:8px}
.quote{font-style:italic}
.hint{margin:0;color:var(--muted);text-align:center;min-height:1.4em}
.hint b{color:var(--ink)}
/* tab strip: one scrollable row that sticks to the top while you browse a panel */
.tabs{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding:8px 0;position:sticky;top:0;z-index:5;background:var(--bg);-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:transparent;border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink)}
.tabs button .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--buoy);color:#1a0d08;font-size:12px;line-height:18px}
.tabs button:focus-visible,.btn:focus-visible,.ghost:focus-visible,.sw:focus-visible,.jcard:focus-visible{outline:2px solid var(--kelp);outline-offset:2px}
#panel{min-height:200px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
h2{font-family:var(--display);font-weight:800;font-size:19px;margin:0}
h5{font-family:var(--display);font-weight:700;font-size:14px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.btn{background:var(--buoy);color:#1d0d06;border:0;border-radius:9px;padding:7px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile.done{border-color:#ffc94d66}
.tile h4{margin:0;font-family:var(--display);font-weight:700;font-size:16px}
.tile .meta{font-size:13px;color:var(--muted)}
.tile .val{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:5px;border-radius:2px;background:#0a161d}
.pips i.on{background:var(--kelp)}
.list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.fishrow{display:grid;grid-template-columns:64px 1fr auto auto;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.fishrow canvas{width:64px;height:32px}
.fishrow .nm{font-weight:700;min-width:0}
.fishrow .nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.fishrow .val{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.fishrow .acts{display:flex;gap:6px}
.sh{color:var(--gold)}
.aq{color:var(--kelp)}
.empty{color:var(--muted);padding:26px 10px;text-align:center;border:1px dashed var(--line);border-radius:12px;margin-top:12px}
.jcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;min-width:0;cursor:pointer;font:inherit;color:inherit}
.jcard:hover{border-color:var(--kelp)}
.jcard.sel{border-color:var(--gold)}
.jcard canvas{width:100px;height:50px;pointer-events:none}
.jcard b{font-family:var(--display);font-size:14px}
.jcard small{color:var(--muted);font-size:11.5px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:8px;margin-top:8px}
.jsec{margin-top:16px}
.prog{height:6px;border-radius:3px;background:#0a161d;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--gold)}
.loc.here{border-color:var(--kelp)}
.loc .sw2{height:46px;border-radius:8px}
.tank{border-radius:12px;border:1px solid var(--line);margin-top:12px;overflow:hidden;background:#082233}
.tank canvas{height:220px;cursor:default}
.bank{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.bank b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.pts{font-family:var(--display);font-weight:800;font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums}
.detail{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:center}
.detail canvas{width:220px;height:110px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;font-size:13.5px}
.kv span{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:13px}
.chipb[aria-pressed="true"]{border-color:var(--kelp);color:var(--kelp)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--kelp)}
.stylewrap{display:grid;grid-template-columns:260px 1fr;gap:16px;margin-top:12px;align-items:start}
.preview{background:linear-gradient(#20435a,#10222b);border:1px solid var(--line);border-radius:12px}
.preview canvas{width:100%;height:auto;cursor:default}
.hatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.hatb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted)}
.hatb canvas{width:56px;height:56px;pointer-events:none}
.hatb[aria-pressed="true"]{border-color:var(--gold);color:var(--ink)}
textarea{width:100%;background:#0a161d;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px;font:12px/1.4 ui-monospace,Consolas,monospace;resize:vertical;word-break:break-all}
textarea:focus-visible{outline:2px solid var(--kelp);outline-offset:1px}
.offer canvas{width:64px;height:64px;cursor:default}
@media (max-width:640px){.stylewrap{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.detail canvas{margin:0 auto}}
.evcard .in{width:min(440px,100%)}
.chests{display:flex;gap:12px;justify-content:center;margin:12px 0}
.chests button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer}
.chests button:hover{border-color:var(--gold)}
.chests canvas{width:96px;height:72px;pointer-events:none}
.setrow{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:6px 0}
.setrow input[type=range]{width:100%;accent-color:var(--buoy)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.toggle button{min-width:64px}
.wheelwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.wheelwrap canvas{width:260px;height:260px;cursor:default}
.scratch{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center}
.scratch button{height:56px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(135deg,#8a96a0,#c8d0d8);font-size:26px;cursor:pointer}
.scratch button.open{background:var(--panel2);cursor:default}
.reveal canvas{width:120px;height:90px;cursor:default;margin:0 auto}
@media (pointer:coarse){.btn{min-height:40px}.btn.sm{min-height:36px}.chipb{min-height:36px;padding:6px 13px}.tabs button{padding:9px 16px}}
@media (max-width:700px){
  body{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-top:10px}
  .wrap{gap:8px}
  .hud{grid-template-columns:repeat(4,1fr);gap:6px}
  .hud>*{height:44px}
  .hud .brand,.hud .opt{display:none}
  .hud .loc{grid-column:span 2}
  .stat{padding:4px 9px;border-radius:9px}
  .stat b{font-size:14px}
  .ghost{padding:4px 8px;font-size:13px}
  .stage{border-radius:12px}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:10px}
  h2{font-size:17px}
}
@media (max-width:480px){.grid{grid-template-columns:1fr}.jgrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}.jcard canvas{width:84px;height:42px}}
@media (max-width:560px){.fishrow{grid-template-columns:48px 1fr auto}.fishrow canvas{width:48px;height:24px}.fishrow .acts{grid-column:1/-1}.setrow{grid-template-columns:110px 1fr 40px}}
@media (min-width:1100px){.hud{grid-template-columns:150px repeat(9,minmax(0,1fr))}}
/* phones held sideways: water on the left, menus scroll on the right (kept last so it wins) */
@media (orientation:landscape) and (max-height:560px){
  body{padding-top:6px;padding-bottom:6px}
  .wrap{max-width:none;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:10px;row-gap:6px;height:calc(100vh - 12px);height:calc(100dvh - 12px)}
  .hud{grid-column:1 / -1;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
  .hud>*{height:38px}
  .hud .brand,.hud .opt{display:none}
  .hud .loc{grid-column:auto}
  .stat{padding:3px 8px}.stat .lbl{font-size:9.5px}.stat b{font-size:13px}
  .ghost{padding:3px 6px;font-size:12px}
  .stage{grid-column:1;grid-row:2 / 4;align-self:start}
  .hint{display:none}
  .tabs{grid-column:2;grid-row:2;position:static;padding:4px 0}
  .tabs button{padding:6px 11px;font-size:13px}
  #panel{grid-column:2;grid-row:3;overflow-y:auto;min-height:0;padding-right:4px;-webkit-overflow-scrolling:touch}
  .grid{grid-template-columns:1fr 1fr}
  .stylewrap{grid-template-columns:1fr}
  .card .in{padding:10px 14px}.card canvas{width:160px;height:80px}
}
/* tabs: a tidy icon grid that always fits, no sideways scrolling */
.tabs,.tabs:where(*){display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:5px;overflow:visible;position:static;padding:8px 0;flex-wrap:wrap}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px;border-radius:12px;font-size:12.5px;position:relative;min-width:0;white-space:normal;border:1px solid var(--line);background:#10222b}
.tabs button:hover{border-color:#2f5866}
.tabs button[aria-selected="true"]{border-color:var(--kelp);color:var(--ink)}
.tabs .ti{font-size:19px;line-height:1.15}
.tabs .tl{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs .dot{position:absolute;top:2px;right:4px;margin:0;min-width:16px;line-height:16px;font-size:11px}
@media (max-width:520px){.tabs{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.tabs button{padding:5px 2px;font-size:10.5px}.tabs .ti{font-size:17px}}
@media (orientation:landscape) and (max-height:560px){.tabs{grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;padding:2px 0}.tabs button{padding:3px 2px;font-size:10px}.tabs .ti{font-size:15px}}
.linkwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}
.qrbox{width:236px;min-height:236px;padding:8px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;flex:0 0 auto}
.qrbox .meta{color:#335}
.qrbox img,.qrbox canvas{width:220px;height:220px;cursor:default}
@media (max-width:520px){.qrbox{width:100%;min-height:0}.qrbox img,.qrbox canvas{width:200px;height:200px}}
@media (max-width:560px){.stylewrap[style*="200px"]{grid-template-columns:1fr!important}.stylewrap[style*="200px"] .preview{max-width:240px;width:100%;margin:0 auto}}
.xfcode{font:800 44px/1.1 ui-monospace,Consolas,monospace;letter-spacing:.12em;color:var(--sun,#ffc94d);text-align:center;padding:10px;margin:6px 0;border-radius:12px;background:#0a161d;border:1px solid var(--line)}
.xfin{flex:1;min-width:0;font:800 26px ui-monospace,Consolas,monospace;letter-spacing:.12em;text-align:center;background:#0a161d;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
.qrbox.sm{width:170px;min-height:170px;flex:none}.qrbox.sm img,.qrbox.sm canvas{width:154px!important;height:154px!important}
.xfmore{margin-top:10px}.xfmore summary{cursor:pointer;color:var(--mute,#9fb3bd);font-weight:700}
.sidetog{display:none}
@media (orientation:landscape) and (max-height:560px){.sidetog{display:flex;position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:58px;border-radius:10px;background:rgba(5,14,20,.62);color:#fff;border:1px solid rgba(255,255,255,.18);font:700 22px/1 system-ui;align-items:center;justify-content:center;z-index:6;padding:0;cursor:pointer;touch-action:manipulation}
body.side-off .wrap{grid-template-columns:minmax(0,1fr)}body.side-off .tabs,body.side-off #panel{display:none!important}body.side-off .stage{grid-column:1 / -1}}
</style>

function accrue(){ const now=Date.now(); if(!S.tankT){ S.tankT=now; return 0; } const mins=Math.min(offlineCap(),Math.max(0,(now-S.tankT)/60000)); const add=tankRate()*mins; S.tankBank+=add; S.tankT=now; return add; }
function offlineIncome(){ const add=accrue(); if(add>=1 && S.tank.length) setTimeout(()=>toast('While you were away your aquarium earned '+fmt(add)+' coins'),900); }

function down(e){
  if(G.star && starHit(e)) return;
  if(G.st!=='reeling' && G.st!=='frenzy' && G.st!=='charging' && G.st!=='result' && petHit(e)) return;
  switch(G.st){
    case 'frenzy': frenzyHit(e); break;
    case 'idle': startCharge(); break;
    case 'waiting': G.st='idle'; G.inHot=false; if(!maxed('streaker')) breakStreak(); toast('Reeled in early. Wait for the big splash.'); break;
    case 'bite': hookIt(); break;
    case 'reeling': G.hold=true; break;
    case 'result': hideCard(); break;
  }
}
function up(){ if(G.st==='charging') release(); else if(G.st==='reeling') G.hold=false; }

// ---------- update ----------
function update(dt){
  if(G.st==='charging'){ G.power+=G.pdir*dt*1.15; if(G.power>=1){G.power=1;G.pdir=-1;} if(G.power<=0){G.power=0;G.pdir=1;} }
  else if(G.st==='flying'){ G.t+=dt/.45; const t=Math.min(1,G.t); G.bob.x=G.from.x+(G.to.x-G.from.x)*t; G.bob.y=G.from.y+(G.to.y-G.from.y)*t - Math.sin(t*Math.PI)*H*.22; if(t>=1) beginWait(); }
  else if(G.st==='waiting'){ G.waitT+=dt; G.nibOn=Math.max(0,G.nibOn-dt);
    for(let i=G.nib.length-1;i>=0;i--) if(G.waitT>=G.nib[i]){ G.nib.splice(i,1); G.nibOn=.3; sfx.nibble(); }
    if(G.waitT>=G.biteAt){ G.pend=chooseCatch(); G.st='bite'; G.biteEnd=G.waitT+hookWin(); sfx.bite(); splash(G.bob.x,G.bob.y,12); } }
  else if(G.st==='bite'){ G.waitT+=dt; if(G.waitT>G.biteEnd){ G.pend=null; endFight('nohook'); } }
  else if(G.st==='reeling'){ fight(dt); }
  else if(G.st==='landing'){ G.land.t+=dt; if(G.land.t>=G.land.dur) finishCatch(); }
  for(let i=G.parts.length-1;i>=0;i--){ const p=G.parts[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=420*dt; if(p.t>p.life) G.parts.splice(i,1); }
  if(weather().k==='Storm'){ G.nextBolt-=dt; if(G.nextBolt<=0){ G.flash=1; G.nextBolt=rnd(6,16); setTimeout(()=>sfx.thunder(),400); } }
  G.flash=Math.max(0,G.flash-dt*2.5);
  // hotspots: ripples on the water where rare fish gather
  if(G.hot){ G.hot.t+=dt; if(G.hot.t>G.hot.life) G.hot=null; }
  else { G.hotNext-=dt*hotRate(); if(G.hotNext<=0){ G.hot={p:rnd(.2,.97), r:.065, t:0, life:rnd(14,22)*(1+.05*pr('reader'))*(maxed('reader')?2:1)}; G.hotNext=rnd(14,32); } }
  updateEvents(dt);
}
function fight(dt){
  const f=G.fish, B=BEH[f.beh]||BEH.calm, line=gv('line'), reel=reelSpeed(); const ratio=clamp(f.str/line,.05,4);
  G.runT-=dt; if(G.runT<=0){ G.run=!G.run; G.runT = G.run ? rnd(.4,1.1)*(.6+f.th)*B.runMul*(.5+.5*G.sta) : rnd(.5,1.7)*(1.3-f.th)*B.restMul/(.4+.6*G.sta); if(G.run){ splash(G.bob.x,G.bob.y,6); G.ev=null; } }
  if(!G.run && (B.shake||B.jump) && !G.ev){ G.evT-=dt; if(G.evT<=0){ G.ev=B.jump?'jump':'shake'; G.evDur=B.jump?.85:.5; G.evT=rnd(1.3,3)/(.5+f.aggr)*(.6+.4/(.3+G.sta)); if(B.jump){ splash(G.bob.x,G.bob.y,14); sfx.jump(); } else sfx.warn(); } }
  if(G.ev){ G.evDur-=dt; if(G.evDur<=0){ if(G.ev==='jump') splash(G.bob.x,G.bob.y,16); G.ev=null; } }
  const tired=.45+.55*G.sta, steady=tensionMult()*(spec('brawler')?1.15:1); G.fightT=(G.fightT||0)+dt;
  const reelK=(spec('brawler')?1.25:spec('gentle')?.9:1)*(maxed('strong')&&G.fightT<2?2:1);
  if(G.hold){
    G.d -= reel*reelK*dt*(G.run?.25:1)*(B.drag?.75:1);
    let add = (G.run?70:22)*ratio*tired*(B.heavy?1.35:1);
    G.temper = Math.min(3, G.temper + dt*(.3+f.aggr*.9)*tempMult());
    add += 36*G.temper*G.temper*(.4+f.aggr)*Math.pow(ratio,.3)*(.35+.65*G.sta);
    const evK=spec('acrobat')?.4:1; if(G.ev==='jump') add += 170*evK; else if(G.ev==='shake') add += (110*Math.pow(ratio,.25)+30)*evK; if(G.run && spec('acrobat')) add*=1.15;
    G.ten += add*steady*dt;
    G.sta = Math.max(0, G.sta - (G.run?.18:.09)*dt*(B.heavy?.6:1));
    G.tickT-=dt; if(G.tickT<=0){ G.tickT=.07; sfx.tick(); }
  } else {
    G.temper = Math.max(0, G.temper - dt*1.8*(maxed('softtouch')?2:1));
    G.ten = Math.max(0, G.ten - 55*dt);
    if(G.run) G.d += (1.5 + f.str*.18) * (.35+.65*G.sta) * dt;
    if(B.drag && !G.run) G.d += (.4 + f.str*.04) * (.3+.7*G.sta) * dt;
    G.sta = Math.max(0, G.sta - .045*dt);
  }
  if(G.run && !G.hold) G.ten = Math.max(G.ten, 6);
  if(G.ten>75 && G.hold){ G.warnT-=dt; if(G.warnT<=0){ G.warnT=.25; sfx.warn(); } }
  const frac = clamp(G.d/G.d0,0,1.6); const x0=W*.24, x1=castX(G.lastCast);

  if(best){ best.hit=best.t; G.fz.caught++; const p=jumperPos(best); splash(p.x,p.y,10); tone(900+G.fz.caught*30,.08,'triangle',.06); } }

  let start=0; for(let i=0;i<idx;i++) start+=WHEEL[i][1]/tot*Math.PI*2; const mid=start+WHEEL[idx][1]/tot*Math.PI*2*rnd(.2,.8);
  const target = -Math.PI/2 - mid; const from=WH.angle; let to=target; while(to<from+Math.PI*8) to+=Math.PI*2;
  WH.spinning=true; WH.result=''; const t0=performance.now(), dur=3800; let lastTick=0;
  const step=()=>{ const k=Math.min(1,(performance.now()-t0)/dur), e=1-Math.pow(1-k,3.4); WH.angle=from+(to-from)*e; drawWheel(); const seg=Math.floor(WH.angle/(Math.PI/6)); if(seg!==lastTick){ lastTick=seg; tone(1500,.02,'square',.02); }
    if(k<1) (window.requestAnimationFrame||setTimeout)(step,16); else { WH.spinning=false; WH.angle%=Math.PI*2; WH.result=wheelPrize(idx); S.gstats.spins++; checkFeats(); save(); lastHud=''; if(S.tab==='games') renderPanel(); } };

function noiseBuf(sec,brown){ const n=AC.sampleRate*sec, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); let last=0; for(let i=0;i<n;i++){ const w=Math.random()*2-1; if(brown){ last=(last+.02*w)/1.02; d[i]=last*3.5; } else d[i]=w; } return b; }

  n.rev=AC.createConvolver(); const len=AC.sampleRate*2.8, ir=AC.createBuffer(2,len,AC.sampleRate); for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); } n.rev.buffer=ir;

  n.dl=AC.createDelay(2); n.dl.delayTime.value=.42; n.fb=AC.createGain(); n.fb.gain.value=.32; n.dlf=AC.createBiquadFilter(); n.dlf.type='lowpass'; n.dlf.frequency.value=1800; n.dl.connect(n.dlf); n.dlf.connect(n.fb); n.fb.connect(n.dl); n.dlf.connect(n.wet); n.dlf.connect(BUS.music); n.dls=AC.createGain(); n.dls.gain.value=.5; n.dls.connect(n.dl);

  const vb=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate), vd=vb.getChannelData(0); for(let i=0;i<vd.length;i++) vd[i]=(Math.random()<.0007?(Math.random()*2-1):0)+(Math.random()*2-1)*.012; n.vin=AC.createBufferSource(); n.vin.buffer=vb; n.vin.loop=true; n.ving=AC.createGain(); n.ving.gain.value=0; const vf=AC.createBiquadFilter(); vf.type='bandpass'; vf.frequency.value=2500; n.vin.connect(vf); vf.connect(n.ving); n.ving.connect(BUS.music); n.vin.start();
  // ambience: waves / stream, wind
  n.wave=AC.createBufferSource(); n.wave.buffer=noiseBuf(6,true); n.wave.loop=true; n.wavef=AC.createBiquadFilter(); n.wavef.type='lowpass'; n.wavef.frequency.value=600; n.waveg=AC.createGain(); n.waveg.gain.value=.05;
  n.lfo=AC.createOscillator(); n.lfo.frequency.value=.08; n.lfog=AC.createGain(); n.lfog.gain.value=.04; n.lfo.connect(n.lfog); n.lfog.connect(n.waveg.gain); n.lfo.start();
  n.wave.connect(n.wavef); n.wavef.connect(n.waveg); n.waveg.connect(BUS.amb); n.wave.start();
  n.wind=AC.createBufferSource(); n.wind.buffer=noiseBuf(4,false); n.wind.loop=true; n.windf=AC.createBiquadFilter(); n.windf.type='bandpass'; n.windf.frequency.value=500; n.windf.Q.value=.7; n.windg=AC.createGain(); n.windg.gain.value=0; n.wind.connect(n.windf); n.windf.connect(n.windg); n.windg.connect(BUS.amb); n.wind.start();

function mv(type,f,t,dur,peak,att,outs,det=0){ const o=AC.createOscillator(), gn=AC.createGain(); o.type=type; o.frequency.value=f; if(det) o.detune.value=det; gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(peak,t+att); gn.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(gn); outs.forEach(x=>gn.connect(x)); o.start(t); o.stop(t+dur+.05); return o; }
function nz(t,dur,peak,ftype,freq,out){ const s=AC.createBufferSource(); s.buffer=MUS.n.white; const f=AC.createBiquadFilter(); f.type=ftype; f.frequency.value=freq; const gn=AC.createGain(); gn.gain.setValueAtTime(peak,t); gn.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f); f.connect(gn); gn.connect(out); s.start(t); s.stop(t+dur+.02); }
function musicTick(){ if(!AC||!MUS.n) return; const n=MUS.n, now=AC.currentTime;
  // ambience follows the water and the time of day
  const L=curLoc(), night=nightness(phase()); const sea=['coast','shelf','deep','trench','reef'].includes(L.id);
  n.waveg.gain.setTargetAtTime(L.id==='river'?.07:sea?(L.id==='deep'?.13:.1):.035, now, 1); n.wavef.frequency.setTargetAtTime(L.id==='river'?1400:L.id==='trench'?300:600, now, 1); n.lfog.gain.setTargetAtTime(L.id==='river'?.01:.045, now, 1);
  n.windg.gain.setTargetAtTime(L.id==='frost'?.05:L.id==='deep'?.02:0, now, 1.5);
  if(S.settings.ambient){ const r=Math.random();
    if(night<.4 && ['pond','river','reef','coast'].includes(L.id) && r<.012){ const t=now+.05; for(let i=0;i<2+Math.floor(Math.random()*3);i++){ const o=mv('sine',2600+Math.random()*900,t+i*.11,.09,.025,.01,[BUS.amb]); o.frequency.exponentialRampToValueAtTime(3600+Math.random()*600,t+i*.11+.07); } }
    if(night>.6 && ['pond','river','reef'].includes(L.id) && r<.06){ const t=now+.05; for(let i=0;i<3;i++) mv('sine',4400+Math.random()*200,t+i*.045,.03,.01,.005,[BUS.amb]); }

    if(L.id==='trench' && r>.996) mv('sine',1250,now+.05,2.5,.02,.01,[BUS.amb, n.wet]); }

    if(st.drums){ if(s===0||s===4||(s===5&&Math.random()<.3)){ const o=mv('sine',110,t,.32,.14,.005,[n.dry]); o.frequency.exponentialRampToValueAtTime(42,t+.14); }

    if(stName==='lofi' && (s===0||s===3||s===6) && Math.random()<.85){ const iv=ivs[(s/3|0)%ivs.length]; const f=mtof(root+24+iv); mv('sine',f,t,1.8,.045,.01,[n.dry,n.wet]); mv('sine',f*2,t,.5,.008,.005,[n.dry]); }
    if(stName==='acoustic'){ const seq=[0,1,2,3,2,1,2,3]; const iv=ivs[seq[s]%ivs.length]; const f=mtof(root+12+iv+(s>=4?12:0)); const o=AC.createOscillator(), fl=AC.createBiquadFilter(), gn=AC.createGain(); o.type='triangle'; o.frequency.value=f; fl.type='lowpass'; fl.frequency.setValueAtTime(3500,t); fl.frequency.exponentialRampToValueAtTime(600,t+.35); gn.gain.setValueAtTime(.055,t); gn.gain.exponentialRampToValueAtTime(.0001,t+1); o.connect(fl); fl.connect(gn); gn.connect(n.dry); gn.connect(n.wet); o.start(t); o.stop(t+1.05); }
    if(stName==='night' && Math.random()<.22){ const f=mtof(st.key+12+PENT[Math.floor(Math.random()*5)]+(Math.random()<.4?12:0)); mv('sine',f,t,3,.03,.01,[n.wet,n.dls]); mv('sine',f*2.76,t,1.1,.006,.005,[n.wet]); }
    // melody: a gentle pentatonic wander with rests
    const phraseRest=(MUS.bar%8)>=6; if(s%2===0 && Math.random()<(phraseRest?st.mel*.3:st.mel)){ MUS.idx=clamp(MUS.idx+pick([-2,-1,-1,0,1,1,2]),0,9); const m=st.key+PENT[MUS.idx%5]+12*Math.floor(MUS.idx/5)+(stName==='acoustic'?0:12);

const ATT_I = Object.fromEntries(ATTS.map(a=>[a.id,a]));
const ATT_COST = [[1500,0],[12000,10],[60000,60]];
const rod = () => ROD_I[S.rods.eq] || ROD_I.bamboo;
const rodLvl = (id=S.rods.eq) => S.rods.lvl[id]||0;
function rodAtts(id=S.rods.eq){ return (S.rods.att[id]||[]).filter(a=>ATT_I[a] && S.atts[a]).slice(0,(ROD_I[id]||ROD_I.bamboo).slots); }
function attVal(a){ const t=S.atts[a]||0; return t ? ATT_I[a].v[t-1] : 0; }
function rodBonus(k){ if(!S.rods) return 0; const r=rod(), L=rodLvl(); let v=(r.st[k]||0);
  if(k==='reel') v+=.03*L; if(k==='tension') v+=.02*L; if(k==='rare') v+=.02*L;
  for(const a of rodAtts()){ const at=ATT_I[a]; if(at.k===k) v+=attVal(a); if(k==='rare' && at.k==='night' && isNight()) v+=attVal(a); }
  return v; }
const rodCast = () => S.rods ? (rod().st.cast||1) : 1;
const rodHook = () => S.rods ? (rod().st.hook||0) + rodAtts().filter(a=>a==='bell').reduce((s,a)=>s+attVal(a),0) : 0;
const rodSpool = () => S.rods ? rodAtts().filter(a=>a==='spool').reduce((s,a)=>s+attVal(a),0) : 0;
const rodUpCost = id => { const L=rodLvl(id); const r=ROD_I[id]; return {coins:Math.round(Math.max(5000,r.price)*.12*(L+1)), scales:(L+1)*(L+1)*2}; };
const statTxt = (k,v) => k==='cast'?'+'+Math.round((v-1)*100)+'% cast distance': k==='hook'?'+'+v.toFixed(2)+' s hook window': k==='spool'?'+'+v+' m of line': k==='night'?'+'+Math.round(v*100)+'% rare odds at night': fmtB(k,v);
function grantRod(id){ if(S.rods.owned.includes(id)) return null; S.rods.owned.push(id); return {title:'New rod: '+ROD_I[id].name+'!', kind:'rod', id}; }
function rodSVG(col,lvl){ return `<svg viewBox="0 0 120 40" width="120" height="40" aria-hidden="true"><path d="M8 34 Q60 30 112 6" stroke="${col}" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="24" cy="31" r="6" fill="#2a2a2a"/><circle cx="24" cy="31" r="2.5" fill="#8a8a8a"/>${lvl?`<text x="112" y="36" fill="#ffc94d" font-size="11" font-weight="700" text-anchor="end">Lv ${lvl}</text>`:''}</svg>`; }
function renderRods(P){ const r=rod(), atts=rodAtts();
  const stats=r=>{ const keys=Object.keys(r.st); return keys.length?keys.map(k=>statTxt(k,r.st[k])).join(' · '):'No special stats'; };
  const slotRow=(i)=>{ const cur=atts[i]||''; const opts=ATTS.filter(a=>S.atts[a.id] && (a.id===cur || !atts.includes(a.id)));
    return `<div class="toggle"><div><b>Slot ${i+1}</b><div class="meta">${cur?ATT_I[cur].name+' '+'I'.repeat(S.atts[cur])+': '+statTxt(ATT_I[cur].k,attVal(cur)):'Empty'}</div></div>
      <div class="chips"><button class="chipb" data-act="rodatt" data-k="${i}:" aria-pressed="${!cur}">None</button>${opts.map(a=>`<button class="chipb" data-act="rodatt" data-k="${i}:${a.id}" aria-pressed="${cur===a.id}">${a.name}</button>`).join('')}</div></div>`; };
  const up=rodUpCost(r.id), L=rodLvl();
  P.innerHTML=`<div class="row spread"><div><h2>Rods</h2><p class="sub">Your rod shapes every cast. Collect rods, upgrade them with coins and <b>Scales</b>, and fit attachments. Scales come from Rare and better fish.</p></div>
   <div style="text-align:right"><div class="pts" style="color:var(--kelp)">${fmt(S.scales)}</div><div class="sub">Scales</div></div></div>
  <div class="tile" style="margin-top:10px;border-color:${r.col}"><div class="row spread"><div class="row">${rodSVG(r.col,L)}<div><div class="rar" style="color:var(--gold)">In your hands</div><h4>${r.name}</h4><div class="meta">${esc(r.d)}</div></div></div>
    <div style="text-align:right"><div class="meta">Level ${L} / 10</div>${L<10?`<button class="btn sm" data-act="rodup" data-k="${r.id}" ${S.money>=up.coins&&S.scales>=up.scales?'':'disabled'}>Upgrade · <span class="coin">${fmt(up.coins)}</span> + ${up.scales} Scales</button>`:'<span class="badge g">Max level</span>'}</div></div>
    <div class="meta">${stats(r)}${L?` · Level bonus: +${3*L}% reel speed, −${2*L}% line tension, +${2*L}% rare odds`:''}</div>
    <h5>Attachments (${r.slots} slot${r.slots>1?'s':''})</h5>${Array.from({length:r.slots},(_,i)=>slotRow(i)).join('')}
    ${!Object.keys(S.atts).length?'<p class="sub">Buy attachments below, then fit them here.</p>':''}</div>
  <h2 style="margin-top:16px">Rod rack</h2><div class="grid">${RODS.map(x=>{ const own=S.rods.owned.includes(x.id), here=S.rods.eq===x.id, open=S.unlocked.includes(x.need), hidden=!own&&x.src!=='shop'&&x.src!=='start';
    const btn = here?'<button class="btn alt sm" disabled>Equipped</button>' : own?`<button class="btn sm" data-act="rodeq" data-k="${x.id}">Equip</button>` : x.src==='shop'?(open?`<button class="btn sm" data-act="rodbuy" data-k="${x.id}" ${S.money>=x.price?'':'disabled'}>Buy · <span class="coin">${fmt(x.price)}</span></button>`:`<span class="meta">Unlock ${LOCS[locIdx(x.need)].name} first</span>`) : '<span class="meta">Not sold anywhere. Keep fishing…</span>';
    return `<div class="tile ${here?'done':''}">${rodSVG(hidden?'#2a4a55':x.col,own?rodLvl(x.id):0)}<h4>${hidden?'???':x.name}</h4><div class="meta">${hidden?'A mystery rod.':esc(x.d)}</div><div class="meta">${hidden?'':stats(x)+' · '+x.slots+' slot'+(x.slots>1?'s':'')}</div>${btn}</div>`; }).join('')}</div>
  <h2 style="margin-top:16px">Attachments</h2><p class="sub">Each attachment has three tiers. Once you own one, it fits on any rod.</p><div class="grid">${ATTS.map(a=>{ const t=S.atts[a.id]||0, next=t<3?ATT_COST[t]:null;
    return `<div class="tile"><div class="row spread"><h4>${a.name}</h4><span class="meta">Tier ${t} / 3</span></div><div class="pips">${[0,1,2].map(i=>`<i class="${i<t?'on':''}"></i>`).join('')}</div><div class="meta">${esc(a.d)}</div>
      <div class="val" style="font-size:14px">${t?statTxt(a.k,a.v[t-1]):'Not owned'}${next?` <span class="meta">→ ${statTxt(a.k,a.v[t])}</span>`:''}</div>
      ${next?`<button class="btn sm" data-act="attbuy" data-k="${a.id}" ${S.money>=next[0]&&S.scales>=next[1]?'':'disabled'}>${t?'Upgrade':'Buy'} · <span class="coin">${fmt(next[0])}</span>${next[1]?' + '+next[1]+' Scales':''}</button>`:'<span class="badge g">Max tier</span>'}</div>`; }).join('')}</div>`; }

let PET_EDIT=null; const editPet = () => (PET_EDIT && (PET_EDIT===S.pet||PET_EDIT===S.pet2)) ? PET_EDIT : S.pet;
function petLook(id=editPet()){ if(!S.petLook[id]) S.petLook[id]={name:'',tint:'none',hat:'none',hatCol:'#c8553a',acc:'none',accCol:'#d8303a'}; return S.petLook[id]; }

function drawPetGear(c,id,lk,t){ if(id==='lily'){ drawLilyGear(c,lk,t); return; } const a=PET_HEAD[id]||[2,-12,4]; const [hx,hy,r]=a; const k=r/7.5;
  const col=lk.accCol||'#d8303a';
  c.save(); c.lineCap='round';
  if(lk.acc==='cape'){ c.fillStyle=col; c.beginPath(); c.moveTo(hx-r*.9,hy+r*.8); c.quadraticCurveTo(hx-r*3.4,hy+r*2+Math.sin(t*4)*1.2,hx-r*3,hy+r*3.6); c.lineTo(hx-r*.4,hy+r*2.4); c.closePath(); c.fill(); }
  if(lk.acc==='balloon'){ c.strokeStyle='#ddd'; c.lineWidth=.5; c.beginPath(); c.moveTo(hx-r,hy+r); c.quadraticCurveTo(hx-r*2,hy-r*3,hx-r*1.6+Math.sin(t*1.5)*1.5,hy-r*6); c.stroke(); c.fillStyle='#ffd84a'; c.save(); c.translate(hx-r*1.6+Math.sin(t*1.5)*1.5,hy-r*6.6); c.beginPath(); for(let i=0;i<10;i++){ const ang=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.6:r*1.4; c.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr); } c.fill(); c.restore(); }
  if(lk.hat && lk.hat!=='none'){ c.save(); c.translate(hx,hy); c.scale(k,k); drawHat(c,lk.hat,HATI[lk.hat]&&HATI[lk.hat].fixed?'#888888':(lk.hatCol||'#c8553a'),t); c.restore(); }
  if(lk.acc==='partyhat'){ c.save(); c.translate(hx,hy); c.scale(k,k); drawHat(c,'party',col,t); c.restore(); }
  const nx=hx-r*.2, ny=hy+r*1.05;

function dayKey(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function makeTasks(){ const L=pick(S.unlocked), base=bestLoot(); const pool=[
  {t:'catch', n:rint(10,20), d:'Land {n} fish'}, {t:'catchat', loc:L, n:rint(5,10), d:'Land {n} fish at '+LOCS[locIdx(L)].name}, {t:'rare', n:rint(2,4), d:'Land {n} Rare or better fish'},
  {t:'pet', n:rint(5,10), d:'Pet {pet} {n} times'}, {t:'hot', n:rint(2,3), d:'Land {n} catches from hotspots'}, {t:'junk', n:2, d:'Fish up {n} pieces of junk'},
  {t:'earn', n:Math.round(base*rint(15,30)), start:S.stats.earned, d:'Earn {n} coins'}, {t:'game', n:rint(1,3), d:'Play {n} Boardwalk games'} ];
  const out=[]; while(out.length<3){ const x=pick(pool); if(out.some(o=>o.t===x.t)) continue; out.push(Object.assign({have:0, claimed:false, coins:Math.round(base*rnd(4,8)), scales:rint(3,8)},x)); } return out; }

  if(!S.stats.caught && !S.savedAt) return null; const day=S.login.streak, mult=Math.min(3,1+day*.25); const coins=earn(bestLoot()*3*mult*coinMult()); const sc=Math.min(10,day); S.scales+=sc; let extra='';

function extraAct2(b){ const k=b.dataset.k, i=+b.dataset.i;
  switch(b.dataset.act){
    case 'rodeq': if(S.rods.owned.includes(k)){ S.rods.eq=k; toast('You pick up the '+ROD_I[k].name+'.'); } return 'render';
    case 'rodbuy': { const r=ROD_I[k]; if(!r||r.src!=='shop'||S.rods.owned.includes(k)||S.money<r.price||!S.unlocked.includes(r.need)) return 'skip'; S.money-=r.price; S.rods.owned.push(k); S.rods.eq=k; sfx.coin(); toast('New rod: '+r.name+'!'); return 'render'; }
    case 'rodup': { const c=rodUpCost(k); if(rodLvl(k)>=10||S.money<c.coins||S.scales<c.scales) return 'skip'; S.money-=c.coins; S.scales-=c.scales; S.rods.lvl[k]=rodLvl(k)+1; sfx.catch(2); toast(ROD_I[k].name+' is now level '+S.rods.lvl[k]); return 'render'; }
    case 'rodatt': { const [si,a]=k.split(':'); const id=S.rods.eq, list=(S.rods.att[id]||[]).slice(); list[+si]=a||''; S.rods.att[id]=list.slice(0,rod().slots); return 'render'; }
    case 'attbuy': { const t=S.atts[k]||0; if(t>=3) return 'skip'; const c=ATT_COST[t]; if(S.money<c[0]||S.scales<c[1]) return 'skip'; S.money-=c[0]; S.scales-=c[1]; S.atts[k]=t+1; sfx.coin(); toast(ATT_I[k].name+' tier '+(t+1)+'!');
      const cur=S.rods.att[S.rods.eq]||[]; if(!t && cur.filter(Boolean).length<rod().slots && !cur.includes(k)){ const l=cur.slice(); const free=l.findIndex(x=>!x); if(free>=0) l[free]=k; else l.push(k); S.rods.att[S.rods.eq]=l.slice(0,rod().slots); } return 'render'; }
    case 'pettint': { const tt=PET_TINTS.find(x=>x[0]===k); if(!tt) return 'skip'; PET_PV=null; if(!S.petTints.includes(k)){ if(!tt[2]||S.money<tt[2]) return 'skip'; S.money-=tt[2]; S.petTints.push(k); sfx.coin(); } petLook().tint=k; return 'render'; }
    case 'petacc': { const a=PET_ACCS.find(x=>x[0]===k); if(!a) return 'skip'; PET_PV=null; if(!S.petAccs.includes(k)){ if(!a[2]||S.money<a[2]) return 'skip'; S.money-=a[2]; S.petAccs.push(k); sfx.coin(); } petLook().acc=k; return 'render'; }
    case 'pethat': if(S.owned.hats.includes(k)) petLook().hat=k; return 'render';
    case 'petcol': petLook()[k]=b.dataset.v; return 'render';
    case 'taskclaim': { const t=ensureDaily().tasks[i]; if(!t||t.claimed||taskHave(t)<t.n) return 'skip'; t.claimed=true; addPassXP(40); earn(t.coins*coinMult()); S.scales+=t.scales; S.gstats.tasks++; sfx.coin(); toast('Task done: +'+fmt(t.coins*coinMult())+' coins, +'+t.scales+' Scales'); return 'render'; }
    case 'taskbonus': { const d=ensureDaily(); if(d.bonus||!d.tasks.every(t=>t.claimed)) return 'skip'; d.bonus=true; S.tokens.small++; sfx.catch(3); toast('All tasks done! A small Mystery Crate is waiting at the Boardwalk.'); return 'render'; }
    case 'patches': showPatchNotes(); return 'skip';
    case 'safereset': { const w=$('resetword'); if(!w||w.value.trim()!=='DELETE') return 'skip'; try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(S)); }catch(e){}
      S=fresh(); S.seenPatch=GAME_VERSION; S.tab='settings'; S.savedAt=Date.now(); G.st='idle'; fillBounties(); toast('Progress erased. A backup was kept. You can restore it in Settings.'); return 'render'; }
    case 'restorebk': { try{ const raw=localStorage.getItem(BACKUP_KEY); if(!raw) return 'skip'; S=migrate(JSON.parse(raw)); S.savedAt=Date.now(); localStorage.removeItem(BACKUP_KEY); G.st='idle'; toast('Backup restored. Welcome back!'); }catch(e){ toast('That backup couldn’t be read.'); } return 'render'; }
    case 'duckagain': { const c=bestLoot(); if(S.money<c) return 'skip'; S.money-=c; newDuck(); taskProgress('game',1); return 'render'; }
    case 'duckpick': { if(!duck||duck.pick>=0) return 'skip'; duck.pick=i; const p=duck.prizes[i]; if(p.k==='crate'){ S.tokens.small++; duck.msg='A small Mystery Crate! Quack.'; sfx.shiny(); } else if(p.k==='coins'){ duck.msg='+'+fmt(earn(bestLoot()*p.m*coinMult()))+' coins. Quack quack.'; sfx.coin(); } else { duck.msg='+'+addTickets(p.n)+' tickets. Quack.'; tone(1200,.08,'triangle',.05); } return 'render'; }
    case 'hilostart': { const c=bestLoot()*2; if(S.money<c) return 'skip'; S.money-=c; newHilo(); taskProgress('game',1); return 'render'; }
    case 'hilo': { if(!hilo||hilo.done) return 'skip'; let n; do{ n=rint(1,13); }while(n===hilo.card); const ok=(k==='hi')===(n>hilo.card); const prev=hilo.card; hilo.card=n;
      if(ok){ hilo.streak++; hilo.pot=Math.round(hilo.pot*1.5); addTickets(3); tone(900+hilo.streak*100,.1,'triangle',.06); if(hilo.streak>=8){ earn(hilo.pot); hilo.done=true; hilo.msg='Eight in a row! The pot pays out: +'+fmt(hilo.pot)+' coins.'; sfx.catch(4); } }
      else { hilo.done=true; hilo.msg=prev+' → '+n+'. Wrong way! The pot sinks to the bottom of the sea.'; addTickets(2); sfx.lost(); } return 'render'; }
    case 'hilocash': { if(!hilo||hilo.done||!hilo.streak) return 'skip'; earn(hilo.pot); hilo.done=true; hilo.msg='Cashed out: +'+fmt(hilo.pot)+' coins after '+hilo.streak+' right guesses.'; sfx.coin(); return 'render'; }
    case 'prize': { const p=PRIZES.find(x=>x[0]===k); if(!p||S.tickets<p[2]||(p[4]&&p[4]())) return 'skip'; S.tickets-=p[2]; const got=p[3](); PREVIEW=null; PET_PV=null; AQ_PV=null;
      if(k==='golden'||k==='rainbow') petLook().tint=k; if(k==='balloon'||k==='partyhat') petLook().acc=k; if(['sixsevencap','carnival','fishbowl'].includes(k)) S.look.hat=k; if(k==='spacesuit') S.look.outfit='spacesuit'; sfx.shiny(); toast('Prize counter: you got '+got+'!'); return 'render'; }
  }
  return undefined; }

function drawHair(c,hs,hair){ c.fillStyle=hair;
  switch(hs){
    case 'short': c.beginPath(); c.arc(0,-57,7.9,Math.PI,Math.PI*2); c.fill(); c.fillRect(-7.9,-58,4.5,5); break;
    case 'long': c.beginPath(); c.arc(0,-57,7.9,Math.PI*.92,Math.PI*2.04); c.fill(); c.beginPath(); c.ellipse(-9.5,-50,2.6,6,.35,0,7); c.fill(); break;
    case 'ponytail': c.beginPath(); c.arc(0,-57,7.9,Math.PI*.95,Math.PI*2.02); c.fill(); c.beginPath(); c.ellipse(-10.5,-54,2.4,6.5,.6,0,7); c.fill(); break;
    case 'bun': c.beginPath(); c.arc(0,-57,7.9,Math.PI*.95,Math.PI*2.02); c.fill(); c.beginPath(); c.arc(-3,-65.5,3.4,0,7); c.fill(); break;
    case 'buzz': c.globalAlpha*=.75; c.beginPath(); c.arc(0,-56.5,7.8,Math.PI*1.02,Math.PI*1.98); c.fill(); c.globalAlpha/=.75; break;
    case 'curly': for(let i=0;i<9;i++){ const a=Math.PI*(1+i/8); c.beginPath(); c.arc(Math.cos(a)*7,-57+Math.sin(a)*7,2.5,0,7); c.fill(); } c.beginPath(); c.arc(-7,-53,2.4,0,7); c.fill(); break;
    case 'spiky': c.beginPath(); c.arc(0,-57,7.6,Math.PI,Math.PI*2); c.fill(); c.beginPath(); for(let i=0;i<6;i++){ const x=-7+i*2.8; c.moveTo(x-1.6,-61); c.lineTo(x+.3,-67-((i*5)%3)); c.lineTo(x+1.6,-61); } c.fill(); break;
    case 'bald': break;
    default: c.beginPath(); c.arc(0,-57,7.9,Math.PI,Math.PI*2); c.fill(); c.fillRect(-7.9,-58,4.5,5);
  } }
function drawFace(c,lk,D,hair){ const b=lk.beard||'none', gl=lk.glasses||'none';
  if(b==='stubble'){ c.fillStyle=hair; c.globalAlpha*=.35; c.beginPath(); c.arc(1.5,-53,6,Math.PI*.05,Math.PI*.95); c.fill(); c.globalAlpha/=.35; }
  if(b==='mustache'){ c.fillStyle=hair; c.beginPath(); c.ellipse(5.4,-53.6,2.6,1,0,0,7); c.fill(); }
  if(b==='beard'||b==='longbeard'){ c.fillStyle=hair; c.beginPath(); c.moveTo(-3,-55); c.quadraticCurveTo(-2,b==='longbeard'?-40:-48,4,b==='longbeard'?-41:-48.5); c.quadraticCurveTo(8.5,-50,7.6,-54); c.lineTo(6,-53); c.quadraticCurveTo(4,-51.5,2,-53); c.closePath(); c.fill(); c.beginPath(); c.ellipse(5.4,-53.6,2.6,1,0,0,7); c.fill(); }
  const ex=4.4, ey=-57; c.lineWidth=.9;
  switch(gl){
    case 'round': c.strokeStyle=D('#2a2a2a'); c.beginPath(); c.arc(ex,ey,2.1,0,7); c.stroke(); c.beginPath(); c.moveTo(ex-2.1,ey); c.lineTo(-1,ey-.5); c.stroke(); break;
    case 'nerd': c.strokeStyle=D('#111'); c.lineWidth=1.4; c.strokeRect(ex-2.2,ey-1.8,4.4,3.4); c.beginPath(); c.moveTo(ex-2.2,ey); c.lineTo(-1,ey-.5); c.stroke(); break;
    case 'sunglasses': c.fillStyle='#111'; c.beginPath(); c.ellipse(ex+.3,ey+.2,2.6,1.8,0,0,7); c.fill(); c.strokeStyle='#111'; c.beginPath(); c.moveTo(ex-2.2,ey); c.lineTo(-1,ey-.5); c.stroke(); c.fillStyle='rgba(255,255,255,.4)'; c.fillRect(ex-.6,ey-.9,1.2,.6); break;
    case 'threed': c.fillStyle='#ff3a4a'; c.fillRect(ex-2.4,ey-1.4,2.3,2.8); c.fillStyle='#3ab0ff'; c.fillRect(ex+.1,ey-1.4,2.3,2.8); c.strokeStyle='#f4f4f4'; c.lineWidth=.6; c.strokeRect(ex-2.4,ey-1.4,4.8,2.8); break;
    case 'heart': c.fillStyle='#ff4a8a'; c.beginPath(); c.moveTo(ex,ey+1.8); c.bezierCurveTo(ex-3.4,ey-.4,ex-1.4,ey-3,ex,ey-1); c.bezierCurveTo(ex+1.4,ey-3,ex+3.4,ey-.4,ex,ey+1.8); c.fill(); break;
    case 'goggles': c.fillStyle='#2a2a2a'; c.fillRect(-7.6,ey-1.2,15,2.4); c.fillStyle='#ff9a2a'; c.beginPath(); c.ellipse(ex+.6,ey,3,2,0,0,7); c.fill(); c.fillStyle='rgba(255,255,255,.5)'; c.fillRect(ex,ey-1,1.4,.6); break;
    case 'monocle': c.strokeStyle='#ffcc33'; c.lineWidth=.8; c.beginPath(); c.arc(ex,ey,2.2,0,7); c.stroke(); c.beginPath(); c.moveTo(ex,ey+2.2); c.quadraticCurveTo(ex-1,ey+6,ex-3,ey+8); c.stroke(); break;
    case 'pixel': c.fillStyle='#111'; c.fillRect(ex-3,ey-1.4,6,1.4); c.fillRect(ex-2.4,ey,2,1.2); c.fillRect(ex+.6,ey,2,1.2); c.fillRect(-1,ey-1.4,2,1); c.fillStyle='#fff'; c.fillRect(ex-1.8,ey,.7,.6); c.fillRect(ex+1.2,ey,.7,.6); break;

  if(r<.12) return {type:'trophy', loc:L, n:1, have:0, reward:Math.round(base*6), scales:4};
  if(r<.24){ const st=pick(STYLE_BOUNTY); return {type:'style', beh:st, n:rint(3,6), have:0, reward:Math.round(bestLoot()*3), scales:3}; }
  if(r<.3) return {type:'shiny', n:1, have:0, reward:Math.round(bestLoot()*12), scales:10};
  return null; }
function bountyText(b){ if(b.type==='trophy') return {what:'Catch any trophy-size fish at '+LOCS[locIdx(b.loc)].name, where:LOCS[locIdx(b.loc)].name};
  if(b.type==='style') return {what:'Catch '+b.n+' '+BEH[b.beh].n.toLowerCase()+'s', where:'Any water'}; if(b.type==='shiny') return {what:'Catch any shiny fish', where:'Any water'}; return null; }
function checkBounties2(f){ const done=[]; for(const b of S.bounties){ if(!['trophy','style','shiny'].includes(b.type)||bDone(b)) continue;
  if(b.type==='trophy' && f.trophy && f.sp.loc===b.loc) b.have=1; if(b.type==='style' && f.sp.beh===b.beh) b.have++; if(b.type==='shiny' && f.shiny) b.have=1; if(bDone(b)) done.push(b); } return done; }

// ---------- more shirt patterns ----------
function drawPatternX(c,pat,base,x,y,w,h){ const dk='rgba(0,0,0,.3)', lt='rgba(255,255,255,.75)';
  switch(pat){
    case 'pinstripe': c.fillStyle=lt; for(let xx=x+1.5;xx<x+w;xx+=3.2) c.fillRect(xx,y,.6,h); break;
    case 'checker': c.fillStyle=dk; for(let yy=y,r=0;yy<y+h;yy+=3.5,r++) for(let xx=x+(r%2)*3.5;xx<x+w;xx+=7) c.fillRect(xx,yy,3.5,3.5); break;
    case 'zigzag': c.strokeStyle=lt; c.lineWidth=1.1; for(let yy=y+3;yy<y+h;yy+=5){ c.beginPath(); for(let xx=x,i=0;xx<=x+w;xx+=2.5,i++) c.lineTo(xx,yy+(i%2?1.6:-1.6)); c.stroke(); } break;
    case 'hearts': c.fillStyle='#ff5a8a'; for(let i=0;i<10;i++){ const hx=x+2+((i*37)%90)/100*w, hy=y+3+((i*53)%85)/100*h; c.beginPath(); c.moveTo(hx,hy+1.4); c.bezierCurveTo(hx-2,hy,hx-1,hy-1.6,hx,hy-.6); c.bezierCurveTo(hx+1,hy-1.6,hx+2,hy,hx,hy+1.4); c.fill(); } break;
    case 'stars': c.fillStyle='#ffe066'; for(let i=0;i<9;i++){ const sx=x+2+((i*41)%90)/100*w, sy=y+3+((i*59)%85)/100*h; c.beginPath(); for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, r=k%2?.7:1.7; c.lineTo(sx+Math.cos(a)*r,sy+Math.sin(a)*r); } c.fill(); } break;
    case 'waves': c.strokeStyle=lt; c.lineWidth=1; for(let yy=y+3;yy<y+h;yy+=4.5){ c.beginPath(); for(let xx=x;xx<=x+w;xx+=1) c.lineTo(xx,yy+Math.sin(xx*.9)*1.1); c.stroke(); } break;
    case 'plaid': c.fillStyle='rgba(200,40,40,.35)'; for(let xx=x;xx<x+w;xx+=6) c.fillRect(xx,y,2.4,h); for(let yy=y;yy<y+h;yy+=6) c.fillRect(x,yy,w,2.4); c.fillStyle='rgba(255,220,90,.5)'; for(let xx=x+4;xx<x+w;xx+=6) c.fillRect(xx,y,.6,h); for(let yy=y+4;yy<y+h;yy+=6) c.fillRect(x,yy,w,.6); break;
    case 'fishbones': c.strokeStyle=lt; c.lineWidth=.6; for(let i=0;i<5;i++){ const fx=x+3+((i*43)%80)/100*w, fy=y+4+((i*61)%80)/100*h; c.beginPath(); c.moveTo(fx-3,fy); c.lineTo(fx+3,fy); for(let k=-2;k<=1;k++){ c.moveTo(fx+k*1.3,fy-1.4); c.lineTo(fx+k*1.3,fy+1.4); } c.moveTo(fx+3,fy); c.arc(fx+3.6,fy,.8,0,7); c.stroke(); } break;
    case 'leopard': for(let i=0;i<16;i++){ const lx=x+((i*37)%100)/100*w, ly=y+((i*53)%100)/100*h; c.fillStyle='rgba(60,30,10,.75)'; c.beginPath(); c.ellipse(lx,ly,1.6,1.2,i,0,7); c.fill(); c.fillStyle='rgba(200,140,60,.6)'; c.beginPath(); c.arc(lx,ly,.6,0,7); c.fill(); } break;
    case 'tiedye': { const gr=c.createRadialGradient(x+w/2,y+h*.45,1,x+w/2,y+h*.45,w); ['#ff5a8a','#ffd84a','#5ad8a0','#5aa9ff','#c38bff','#ff5a8a'].forEach((cl,i)=>gr.addColorStop(i/5,cl)); c.globalAlpha*=.75; c.fillStyle=gr; c.fillRect(x,y,w,h); c.globalAlpha/=.75; break; }
    case 'pixel': for(let yy=y;yy<y+h;yy+=3) for(let xx=x;xx<x+w;xx+=3){ const v=(Math.floor(xx*7+yy*13))%5; if(v<2){ c.fillStyle=v?'rgba(255,255,255,.35)':'rgba(0,0,0,.3)'; c.fillRect(xx,yy,3,3); } } break;
    case 'sunset': { const gr=c.createLinearGradient(0,y,0,y+h); gr.addColorStop(0,'#ff9a5a'); gr.addColorStop(.5,'#ff5a8a'); gr.addColorStop(1,'#6a4ad8'); c.globalAlpha*=.8; c.fillStyle=gr; c.fillRect(x,y,w,h); c.globalAlpha/=.8; break; }
    case 'galaxy': c.fillStyle='rgba(20,10,50,.75)'; c.fillRect(x,y,w,h); c.fillStyle='rgba(160,90,255,.45)'; c.beginPath(); c.ellipse(x+w*.5,y+h*.5,w*.45,h*.18,-.5,0,7); c.fill(); c.fillStyle='#fff'; for(let i=0;i<14;i++) c.fillRect(x+((i*37)%100)/100*w,y+((i*61)%100)/100*h,.7,.7); break;
    case 'sixseven': c.fillStyle='rgba(255,224,90,.85)'; c.font='800 4px system-ui'; for(let yy=y+4,r=0;yy<y+h;yy+=5,r++) for(let xx=x+(r%2)*3;xx<x+w;xx+=7) c.fillText(r%2?'7':'6',xx,yy); break;
  } }

// ---------- Tide Pass ----------
const PASS_MAX = 50;
const passNeed = L => 120 + L*25;
const PASS_XP = [8,14,30,60,150,400];
const PASS_SPECIAL = {3:['dock','tideflag','Tide Flag (dock)'],8:['tint','tidal','Tidal pet colour'],12:['hat','tidecap','Tide Cap (hat)'],18:['dock','shipwheel','Ship’s Wheel (dock)'],25:['wood','pearl','Pearl dock wood'],30:['out','tidecoat','Tide Coat (outfit)'],40:['dock','minilight','Tiny Lighthouse (dock)'],50:['legend','','Legendary Mystery Crate']};
function passReward(L){ if(PASS_SPECIAL[L]) return PASS_SPECIAL[L][2]; if(L>PASS_MAX) return 'Coins and 15 Scales'; return ['Big Mystery Crate','Coins','10 Scales','60 tickets','Small Mystery Crate'][L%5]; }
function grantPass(L){ const sp=PASS_SPECIAL[L], base=bestLoot(); if(L%10===0 && maxed('tidewalker')) S.tokens.big++;
  if(sp){ const [k,id]=sp; if(k==='dock'&&!S.dock.owned.includes(id)) S.dock.owned.push(id); if(k==='tint'&&!S.petTints.includes(id)) S.petTints.push(id); if(k==='hat'&&!S.owned.hats.includes(id)) S.owned.hats.push(id);
    if(k==='wood'&&!S.dock.owned.includes(id)) S.dock.owned.push(id); if(k==='out'&&!S.owned.outfits.includes(id)) S.owned.outfits.push(id); if(k==='legend') S.tokens.legend++; return sp[2]; }
  if(L>PASS_MAX){ earn(base*10*coinMult()); S.scales+=15; return 'Coins and 15 Scales'; }
  switch(L%5){ case 0: S.tokens.big++; break; case 1: earn(base*8*coinMult()); break; case 2: S.scales+=10; break; case 3: S.tickets+=60; break; case 4: S.tokens.small++; break; } return passReward(L); }
function addPassXP(n){ S.pass.xp+=Math.round(n*(1+.06*pr('tidewalker'))); let ups=0; while(S.pass.xp>=passNeed(S.pass.lvl+1)){ S.pass.xp-=passNeed(S.pass.lvl+1); S.pass.lvl++; ups++; } if(ups){ setTimeout(()=>toast('Tide Pass level '+S.pass.lvl+'! Rewards are waiting in the Pass tab.'),1300); } }
function renderPass(P){ const pl=S.pass.lvl, need=passNeed(pl+1), unclaimed=pl-S.pass.claimed;
  const shown=[]; const start=Math.max(1,Math.min(S.pass.claimed+1, pl+1)-2); for(let L=start; L<start+15; L++) shown.push(L);
  P.innerHTML=`<div class="row spread"><div><h2>Tide Pass</h2><p class="sub">Every fish you land fills the Tide Pass. Rarer fish fill it faster. ${PASS_MAX} levels of rewards, with special ones along the way, then bonus rewards forever.</p></div>
   <div class="tile" style="min-width:220px"><div class="rar" style="color:var(--kelp)">Level ${pl}</div><div class="meta">${fmt(S.pass.xp)} / ${fmt(need)} to level ${pl+1}</div><div class="prog"><i style="width:${S.pass.xp/need*100}%;background:var(--kelp)"></i></div>
   ${unclaimed?`<button class="btn" data-act="passclaim" style="margin-top:6px">Claim ${unclaimed} reward${unclaimed>1?'s':''}</button>`:''}</div></div>
   <div class="passtrack">${shown.map(L=>{ const got=L<=S.pass.claimed, ready=!got&&L<=pl, sp=PASS_SPECIAL[L];
     return `<div class="passcell ${got?'got':''} ${ready?'ready':''} ${sp?'special':''}"><span class="lv">${L}</span><canvas width="120" height="90" data-pass="${L}"></canvas><span>${got?'✓ ':''}${esc(sp&&!got&&L>pl?(sp[0]==='legend'?sp[2]:'A special reward'):passReward(L))}</span></div>`; }).join('')}</div>
   <p class="sub" style="margin-top:8px">Fish ×${PASS_XP.join(' / ')} XP by rarity. Shiny ×2, trophy ×1.5. Daily tasks and derbies give extra.</p>`;
  P.querySelectorAll('canvas[data-pass]').forEach(cv2=>{ const L=+cv2.dataset.pass, sp=PASS_SPECIAL[L], x=cv2.getContext('2d'); x.clearRect(0,0,120,90); const secret=sp&&L>pl&&sp[0]!=='legend'; if(secret) x.filter='brightness(0) opacity(.5)';
    if(sp){ if(sp[0]==='dock') drawDockItem(x,sp[1],60,80,2.4,0,0); else if(sp[0]==='hat') hatPreview(x,120,90,sp[1],S.look.hatCol); else if(sp[0]==='out') drawAngler(x,60,86,1.1,Object.assign({},S.look,{outfit:sp[1],hat:'none'}),{}); else if(sp[0]==='tint') drawPetStyled(x,S.pet,60,78,2.8,0,0,Object.assign({},petLook(),{tint:sp[1]})); else if(sp[0]==='wood'){ x.fillStyle='#f0e8f4'; x.fillRect(10,45,100,12); x.fillStyle='#c8b8d0'; for(let i=0;i<5;i++) x.fillRect(14+i*20,45,2,12); } else drawJunk(x,120,90,'crown'); }
    else { const k=L>PASS_MAX?1:L%5; if(k===0||k===4) drawJunk(x,120,90,'chest'); else if(k===1) drawJunk(x,120,90,'coin'); else if(k===2){ x.fillStyle='#7fc8a9'; x.beginPath(); for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; x.lineTo(60+Math.cos(a)*24,45+Math.sin(a)*24); } x.fill(); } else { x.font='34px system-ui'; x.textAlign='center'; x.fillText('🎟',60,58); } }
    x.filter='none'; }); }

// ---------- Fishing Derby ----------
const DERBY_LEN = 4*60*1000;
const RIVALS = [['Old Pete','has fished here since before the dock'],['Marina','never misses a hook'],['Captain Gull','a seagull in a captain’s hat']];
function derbyCost(){ return Math.round(bestLoot()*3); }
function startDerby(){ const sps=spAt(S.loc).filter(s=>s.r<=1); const mean=sps.reduce((a,s)=>a+(s.min+s.max)/2*RAR[s.r].w,0)/sps.reduce((a,s)=>a+RAR[s.r].w,0);
  const soft=(1-.04*pr('derbypro'))*(relic('derbyhorn')?.9:1);
  const rivals=RIVALS.map((r,i)=>({name:r[0], score:+(mean*14*[.7,1,1.35][i]*rnd(.85,1.15)*soft).toFixed(1)}));
  S.derby={until:Date.now()+(maxed('derbypro')?5*60*1000:DERBY_LEN), loc:S.loc, total:0, n:0, best:0, rivals}; toast('The derby has begun! Heaviest total catch at '+curLoc().name+' in 4 minutes wins.'); sfx.catch(3); }
function derbyCatch(f){ const d=S.derby; if(!d||Date.now()>d.until||S.loc!==d.loc||f.kind!=='fish') return; d.total=+(d.total+f.kg).toFixed(2); d.n++; d.best=Math.max(d.best,f.kg); }
function derbyPlace(){ const d=S.derby; return 1+d.rivals.filter(r=>r.score>d.total).length; }
function endDerby(){ const d=S.derby; if(!d) return; const place=derbyPlace(), base=bestLoot(); S.derby=null; const medal=['gold','silver','bronze'][place-1]; let txt;
  if(medal){ const m=[1,.5,.25][place-1]; const coins=earn(base*25*m*coinMult()), sc=Math.round(30*m), tk=Math.round(150*m); S.scales+=sc; S.tickets+=tk; S.medals[medal]++; addPassXP(300*m); txt=`+${fmt(coins)} coins, +${sc} Scales, +${tk} tickets`; sfx.catch(4); }
  else { S.tickets+=20; txt='+20 tickets for taking part'; sfx.lost(); }
  G.st = G.st==='idle'||G.st==='result'?G.st:G.st; $('evin').innerHTML=`<div class="rar" style="color:var(--gold)">Fishing derby results</div><h3>${medal?['🥇 First place!','🥈 Second place','🥉 Third place'][place-1]:'Fourth place. Next time!'}</h3>
   <div class="list" style="margin:8px 0">${[{name:'You',score:d.total},...d.rivals].sort((a,b)=>b.score-a.score).map((r,i)=>`<div class="row spread prize"><span>${i+1}. <b>${esc(r.name)}</b></span><span>${r.score.toFixed(1)} kg</span></div>`).join('')}</div>
   <p class="sub">${txt}</p><button class="btn" data-ev="skip">Back to fishing</button>`; if(G.st==='idle'){ G.st='event'; $('evcard').hidden=false; } else { setTimeout(()=>{ if(G.st==='idle'){ G.st='event'; $('evcard').hidden=false; } else toast('Derby over: place '+place+'. '+txt); },2500); } checkFeats(); save(); }
setInterval(()=>{ if(S.derby && Date.now()>=S.derby.until) endDerby(); const dl=$('derbyleft'); if(dl&&S.derby) dl.textContent=mmss(Math.max(0,Math.ceil((S.derby.until-Date.now())/1000)))+' left'; },1000);
function derbyHTML(){ const d=S.derby; if(d){ const left=Math.max(0,Math.ceil((d.until-Date.now())/1000));
    return `<div class="tile bwt" style="--c:#ffc94d;margin-bottom:12px"><div class="row spread"><h4>Fishing derby at ${LOCS[locIdx(d.loc)].name}</h4><span class="badge g" id="derbyleft">${mmss(left)} left</span></div><div class="meta">Your total: <b>${d.total.toFixed(1)} kg</b> from ${d.n} fish · you’re in place ${derbyPlace()}${S.loc!==d.loc?' · <span style="color:var(--danger)">travel back there for catches to count!</span>':''}</div>
     ${d.rivals.map(r=>`<div class="meta">${esc(r.name)}: ${r.score.toFixed(1)} kg</div>`).join('')}</div>`; }
  return `<div class="tile bwt" style="--c:#ffc94d;margin-bottom:12px"><div class="row spread"><div><h4>Fishing derby</h4><div class="meta">Four minutes at ${curLoc().name}: land the heaviest total catch to beat ${RIVALS.map(r=>r[0]).join(', ')}. Medals pay coins, Scales, tickets and Tide Pass XP.</div><div class="meta">Medals: 🥇 ${S.medals.gold} · 🥈 ${S.medals.silver} · 🥉 ${S.medals.bronze}</div></div>
    <button class="btn" data-act="derby" ${S.money>=derbyCost()&&G.st==='idle'?'':'disabled'}>Enter · <span class="coin">${fmt(derbyCost())}</span></button></div></div>`; }
function drawDerbyHUD(){ const d=S.derby; if(!d) return; const left=Math.max(0,Math.ceil((d.until-Date.now())/1000)); const txt='🏆 Derby '+mmss(left)+' · '+d.total.toFixed(1)+' kg · #'+derbyPlace()+(S.loc!==d.loc?' (wrong water)':'');
  g.font='700 12px system-ui'; const tw=g.measureText(txt).width; g.fillStyle='rgba(5,14,20,.78)'; rr(W-tw-34,40,tw+20,24,12); g.fill(); g.fillStyle='#ffc94d'; g.textAlign='left'; g.fillText(txt,W-tw-24,56); }

const MOUNT = {pond:['#7a9ab8',.16],river:['#6a8aa8',.22],coast:['#9aa8b8',.12],frost:['#c8d8e8',.24],reef:['#7ab8c8',.1],ember:['#5a3a3a',.26],starfall:['#4a3a8a',.14]};
function drawBackLayer(L,t,night,hz,skyBot){ const m=MOUNT[L.id]; const t0=t;
  if(m){ const col=mix(mix(m[0],skyBot,.45),'#0a1220',night*.6); g.fillStyle=col; g.beginPath(); g.moveTo(0,hz); for(let x=0;x<=W;x+=10){ const y=hz-H*m[1]*(.45+.35*Math.sin(x/W*5.1+L.freq)+.2*Math.sin(x/W*13.3)); g.lineTo(x,y); } g.lineTo(W,hz); g.fill();
    if(L.id==='frost'||L.id==='river'||L.id==='starfall'){ g.fillStyle=mix(L.id==='starfall'?'#e8d8ff':'#ffffff',col,night*.5); for(let x=0;x<=W;x+=W/7){ const y=hz-H*m[1]*(.45+.35*Math.sin(x/W*5.1+L.freq)+.2*Math.sin(x/W*13.3)); g.beginPath(); g.moveTo(x-10,y+7); g.lineTo(x,y); g.lineTo(x+10,y+7); g.fill(); } } }
  // soft cloud banks
  if(L.id!=='trench'&&L.id!=='deep'){ for(let i=0;i<3;i++){ const cx=((i*W/2.2)+t0*(3+i))%(W+300)-150, cy=hz*(.22+.15*i), sc2=1+i*.25; const gr=g.createLinearGradient(0,cy-20*sc2,0,cy+16*sc2); gr.addColorStop(0,'rgba(255,255,255,'+(.42-night*.32)+')'); gr.addColorStop(1,'rgba(200,210,225,'+(.18-night*.12)+')'); g.fillStyle=gr; g.beginPath(); g.ellipse(cx,cy,60*sc2,14*sc2,0,0,7); g.ellipse(cx+35*sc2,cy-8*sc2,34*sc2,13*sc2,0,0,7); g.ellipse(cx-30*sc2,cy-4*sc2,28*sc2,10*sc2,0,0,7); g.fill(); } } }
function drawGodRays(t,dusk,bx,by,hz){ if(dusk<.15 || !S.settings.effects) return; g.save(); g.globalAlpha=Math.min(.18,dusk*.2); g.fillStyle='#ffd8a0'; for(let i=0;i<5;i++){ const a=-.9+i*.45+Math.sin(t*.1+i)*.05; g.beginPath(); g.moveTo(bx,by); g.lineTo(bx+Math.cos(a)*W,by+Math.sin(a)*W*.15+hz*.6); g.lineTo(bx+Math.cos(a+.08)*W,by+Math.sin(a+.08)*W*.15+hz*.6); g.fill(); } g.restore(); }
function drawReflect(L,night,hz){ if(L.amp<=0) return; g.save(); g.globalAlpha=.16-night*.08; g.fillStyle=mix(L.hill,'#0a1220',night*.7); g.beginPath(); g.moveTo(0,hz); for(let x=0;x<=W;x+=8){ const y=hz + ((Math.sin(x/W*L.freq*Math.PI+1)*.5+.5)*H*L.amp + Math.sin(x/W*L.freq*7.3)*H*L.amp*.25 + H*.012)*.55; g.lineTo(x,y); } g.lineTo(W,hz); g.fill(); g.restore(); }
let AMB={jumps:[], nextJump:3, flies:null, leaves:null};
function drawAmbient(L,t,night,hz,dt){ if(!S.settings.effects) return;
  // distant fish jumping, with ripples
  AMB.nextJump-=dt; if(AMB.nextJump<=0){ AMB.nextJump=rnd(4,9); AMB.jumps.push({x:rnd(W*.35,W*.95), t:0}); }
  for(let i=AMB.jumps.length-1;i>=0;i--){ const j=AMB.jumps[i]; j.t+=dt; if(j.t>2.4){ AMB.jumps.splice(i,1); continue; } const y0=hz+(j.x-W*.3)/(W*.7)*H*.06+H*.04;
    if(j.t<.6){ const k=j.t/.6; g.save(); g.translate(j.x+k*14,y0-Math.sin(k*Math.PI)*12); g.rotate(-Math.cos(k*Math.PI)*.9); g.fillStyle=mix('#5a7a8a','#0a1220',night*.6); g.beginPath(); g.ellipse(0,0,4,1.6,0,0,7); g.fill(); g.restore(); }
    const rk=Math.max(0,j.t-.5); if(rk>0){ g.strokeStyle='rgba(255,255,255,'+(.35*(1-rk/1.9))+')'; g.lineWidth=1; g.beginPath(); g.ellipse(j.x+14,y0,rk*12,rk*3,0,0,7); g.stroke(); } }
  // dragonflies by day, near the shore
  if(night<.4 && ['pond','river','reef','ember'].includes(L.id)){ for(let i=0;i<3;i++){ const x=W*(.3+.2*i)+Math.sin(t*1.3+i*2)*40+Math.sin(t*4.1+i)*8, y=hz+H*.06+Math.sin(t*1.7+i)*14+Math.cos(t*5+i)*3; g.fillStyle=L.id==='ember'?'#ff9a4a':'#3ab0e0'; g.fillRect(x-3,y,6,1.2); g.fillStyle='rgba(220,240,255,.6)'; g.fillRect(x-1,y-2+Math.sin(t*40)*.6,1,1.6); g.fillRect(x+1,y-2-Math.sin(t*40)*.6,1,1.6); } }
  // falling leaves
  if(['pond','river'].includes(L.id)){ if(!AMB.leaves) AMB.leaves=Array.from({length:10},()=>[Math.random(),Math.random(),.5+Math.random()]); const cols=['#d8903a','#c8553a','#e0c050','#a86a2a'];
    AMB.leaves.forEach((lf,i)=>{ const x=((lf[0]*W+Math.sin(t*.8+i)*30+t*12*lf[2])%W+W)%W, y=((lf[1]*H*.7+t*18*lf[2])%(H*.7)); g.save(); g.translate(x,y); g.rotate(t*2+i); g.fillStyle=mix(cols[i%4],'#0a1220',night*.6); g.beginPath(); g.ellipse(0,0,3,1.6,0,0,7); g.fill(); g.restore(); }); }
  // shooting stars over the sky lake, always
  if(L.id==='starfall'){ const k=(t*.35)%1, i=Math.floor(t*.35)%5; const sx=W*(.3+.13*i)-k*W*.3, sy=hz*(.1+.07*(i%3))+k*hz*.25; const gr=g.createLinearGradient(sx,sy,sx+60,sy-20); gr.addColorStop(0,'rgba(255,255,240,'+Math.sin(k*Math.PI)+')'); gr.addColorStop(1,'rgba(255,255,240,0)'); g.strokeStyle=gr; g.lineWidth=2; g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx+60,sy-20); g.stroke(); }
  // embers rising at the springs
  if(L.id==='ember'){ for(let i=0;i<18;i++){ const x=(i*97+Math.sin(t+i)*20)%W, y=H-((t*25+i*60)%(H*.9)); g.fillStyle='rgba(255,'+(140+(i%3)*40)+',60,'+(.5+.4*Math.sin(t*3+i))+')'; g.fillRect(x,y,2,2); } } }
function drawVignette(night){ const gr=g.createRadialGradient(W/2,H*.55,Math.min(W,H)*.35,W/2,H*.55,Math.max(W,H)*.75); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(4,10,16,'+(.22+night*.2)+')'); g.fillStyle=gr; g.fillRect(0,0,W,H); }

// ---------- actions ----------
function extraAct5(b){ const k=b.dataset.k;
  switch(b.dataset.act){
    case 'derby': { if(S.derby||G.st!=='idle') return 'skip'; const c=derbyCost(); if(S.money<c) return 'skip'; S.money-=c; startDerby(); return 'render'; }
    case 'passclaim': { const got=[]; while(S.pass.claimed<S.pass.lvl){ S.pass.claimed++; got.push(grantPass(S.pass.claimed)); } if(got.length){ sfx.shiny(); toast('Tide Pass: '+got.slice(0,3).join(', ')+(got.length>3?' and more':'')); renderBait(); } return 'render'; }
    case 'dockwood': { const w=DOCK_WOODS.find(x=>x[0]===k); if(!w) return 'skip'; if(!S.dock.owned.includes(k)){ if(!w[2]||S.money<w[2]) return 'skip'; S.money-=w[2]; S.dock.owned.push(k); sfx.coin(); } S.dock.wood=k; DOCK_PV=null; return 'render'; }
    case 'dockdecor': { const d=DOCKI[k]; if(!d) return 'skip'; DOCK_PV=null; if(!S.dock.owned.includes(k)){ if(d.src!=='shop'||S.money<d.price) return 'skip'; S.money-=d.price; S.dock.owned.push(k); sfx.coin(); }
      if(S.dock.decor.includes(k)) S.dock.decor=S.dock.decor.filter(x=>x!==k); else if(S.dock.decor.length<DOCK_SLOTS){ S.dock.decor.push(k); toast(d.name+' placed. Cozy!'); } else toast('Your dock is full. Remove something first.'); return 'render'; }
    case 'dockpv': { const [kind,id]=k.split(':'); if(kind==='wood'){ const w=DOCK_WOODS.find(x=>x[0]===id); DOCK_PV={kind,id,name:w[1]+' wood',price:w[2]}; } else { const d=DOCKI[id]; DOCK_PV={kind:'decor',id,name:d.name,price:d.price}; } setTimeout(()=>{ const c=$('homecv'); c&&c.scrollIntoView({behavior:'smooth',block:'center'}); },30); return 'render'; }
    case 'dockpvoff': DOCK_PV=null; return 'render';
  }
  return undefined; }

// ---------- Ember Springs & Starfall Lake looks ----------
function drawFarX(L,t,night,hz){ const N=cl=>mix(cl,'#0a1220',night*.6); const sy=x=>hz-(Math.sin(x/W*L.freq*Math.PI+1)*.5+.5)*H*L.amp-Math.sin(x/W*L.freq*7.3)*H*L.amp*.25-H*.012;
  if(L.id==='ember'){ const vx=W*.72, vy=sy(vx)+2; g.fillStyle=N('#2a1a18'); g.beginPath(); g.moveTo(vx-H*.22,vy+4); g.lineTo(vx-H*.04,vy-H*.2); g.lineTo(vx+H*.04,vy-H*.2); g.lineTo(vx+H*.22,vy+4); g.fill();
    g.fillStyle='rgba(255,120,40,'+(.5+night*.4)+')'; g.beginPath(); g.moveTo(vx-H*.03,vy-H*.2); g.lineTo(vx-H*.015,vy-H*.12); g.lineTo(vx+H*.01,vy-H*.15); g.lineTo(vx+H*.03,vy-H*.2); g.fill();
    for(let i=0;i<6;i++){ const k=((t*.12+i/6)%1); g.fillStyle='rgba(90,80,80,'+(.4*(1-k))+')'; g.beginPath(); g.arc(vx+Math.sin(t*.3+i)*10+k*30,vy-H*.2-k*H*.25,6+k*22,0,7); g.fill(); }
    for(let i=0;i<4;i++){ const x=W*(.35+.15*i); g.fillStyle='rgba(240,240,240,'+(.12+.06*Math.sin(t+i))+')'; for(let k=0;k<3;k++){ g.beginPath(); g.arc(x+Math.sin(t*.8+k)*6,hz+4-k*8-((t*8)%8),5+k*2,0,7); g.fill(); } } }
  if(L.id==='starfall'){ for(const [ix,iy,ir] of [[.3,.55,.05],[.62,.4,.035],[.85,.6,.06]]){ const x=W*ix, y=hz*iy+Math.sin(t*.5+ix*9)*4; g.fillStyle=N('#4a8a5a'); g.beginPath(); g.ellipse(x,y,W*ir,H*.012,0,Math.PI,0); g.fill(); g.fillStyle=N('#5a4a7a'); g.beginPath(); g.moveTo(x-W*ir,y); g.lineTo(x,y+H*.06); g.lineTo(x+W*ir,y); g.fill(); g.fillStyle='rgba(180,220,255,.5)'; for(let k=0;k<3;k++) g.fillRect(x-4+k*4,y+H*.06+((t*20+k*7)%20),1,4); }
    const px=W*.15, py=hz*.3; const gr=g.createRadialGradient(px-6,py-6,2,px,py,26); gr.addColorStop(0,'#ffd0a0'); gr.addColorStop(1,'#a85a8a'); g.fillStyle=gr; g.beginPath(); g.arc(px,py,24,0,7); g.fill(); g.strokeStyle='rgba(255,220,180,.6)'; g.lineWidth=2; g.beginPath(); g.ellipse(px,py,40,8,-.3,0,7); g.stroke(); } }
function drawWaterDecoX(L,t,night,hz){ if(L.id==='ember'){ for(let i=0;i<10;i++){ const x=W*(.3+((i*37)%70)/100), y=hz+H*(.08+((i*53)%40)/100), k=((t*.6+i*.3)%1); g.strokeStyle='rgba(255,200,120,'+(.4*(1-k))+')'; g.lineWidth=1; g.beginPath(); g.arc(x,y,2+k*6,0,7); g.stroke(); }
    for(const [fx,fy] of [[.45,.7],[.8,.62],[.6,.85]]){ const x=W*fx, y=H*fy; g.fillStyle='#2a1a18'; g.beginPath(); g.ellipse(x,y,16,6,0,Math.PI,0); g.fill(); g.fillStyle='rgba(255,110,40,'+(.5+.3*Math.sin(t*2+fx*9))+')'; g.fillRect(x-6,y-3,12,1.5); } }
  if(L.id==='starfall'){ for(let i=0;i<40;i++){ const x=(i*61)%W, y=hz+((i*37)%100)/100*(H-hz); g.fillStyle='rgba(255,255,255,'+(.25+.35*Math.abs(Math.sin(t*1.5+i)))+')'; g.fillRect(x,y,1.4,1.4); }
    g.strokeStyle='rgba(200,160,255,.25)'; g.lineWidth=1; for(let i=0;i<3;i++){ g.beginPath(); g.ellipse(W*(.4+.25*i),H*(.7+.05*i),30+10*Math.sin(t+i),6,0,0,7); g.stroke(); } } }
function drawPlatformX(L,t,night,dockY,pb){ const PW=W*.19, N=(cl,k=.6)=>mix(cl,'#0a1018',night*k);
  if(L.plat==='stone'){ g.fillStyle=N('#3a2a28'); g.beginPath(); g.moveTo(-2,dockY); g.lineTo(PW*.4,dockY-3); g.lineTo(PW+8,dockY+2); g.lineTo(PW+20,H); g.lineTo(-2,H); g.fill(); g.fillStyle=N('#4a3a36'); for(let i=0;i<6;i++){ g.beginPath(); g.ellipse(((i*37)%100)/100*PW,dockY+10+((i*53)%60)/100*(H-dockY),8,4,0,0,7); g.fill(); }
    g.strokeStyle='rgba(255,110,40,'+(.5+.2*Math.sin(t*2))+')'; g.lineWidth=1.5; g.beginPath(); g.moveTo(PW*.2,dockY+8); g.lineTo(PW*.35,dockY+20); g.lineTo(PW*.3,dockY+34); g.stroke(); g.fillStyle=N(dockWood()); g.fillRect(-2,dockY-2,PW*.9,4); }
  else { const y=dockY+Math.sin(t*.8)*2; g.fillStyle=N('#8a7ad8',.4); g.beginPath(); g.moveTo(-2,y); g.lineTo(PW+6,y); g.lineTo(PW*.75,y+H*.14); g.lineTo(PW*.4,y+H*.22); g.lineTo(PW*.1,y+H*.12); g.lineTo(-2,y+H*.1); g.fill();
    g.fillStyle='rgba(220,200,255,.35)'; g.beginPath(); g.moveTo(PW*.2,y); g.lineTo(PW*.4,y+H*.18); g.lineTo(PW*.5,y); g.fill(); g.fillStyle=N(dockWood(),.4); g.fillRect(-2,y-3,PW+8,4); for(let i=0;i<3;i++){ g.fillStyle='rgba(200,180,255,'+(.4+.3*Math.sin(t*2+i))+')'; g.fillRect(PW*(.3+.2*i),y+H*.2+((t*14+i*9)%18),2,2); } } }

const SHARE_BASE = 'https://sizzentra.github.io/driftline/';
let shareLink='', qrState='';
// links use URL-safe base64 (no escaping), which keeps them short
async function makeShareLink(){ const code=await makeCode(); const tag=code.slice(0,4), b=code.slice(4).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); return SHARE_BASE+'#load='+tag+b; }
function codeFromAny(v){ v=String(v||'').trim(); const i=v.indexOf('#load='); if(i<0) return v; let c=decodeURIComponent(v.slice(i+6)); const tag=c.slice(0,4); let b=c.slice(4).replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='='; return tag+b; }

// ---------- device to device: a 6-digit code (works PC <-> phone in both directions) ----------
// The device WITH the progress taps Send: its progress goes into a short-lived mailbox named after a
// 6-digit code (ntfy.sh, a free public relay; files expire there after a few hours). The other device
// taps Get progress, types the code (a phone can scan the QR) and picks it up. Plain HTTPS, so it works
// on any network: no direct device-to-device connection that routers can block.
const XF_RELAY='https://ntfy.sh/', XF_PREFIX='driftline-move-';
let XF={mode:null, code:'', stat:'', ok:false, ready:false, es:null, timer:0, run:0};
function loadLib(src,test){ return new Promise((res,rej)=>{ if(test()) return res(); const s=document.createElement('script'); s.src=src; s.onload=()=>res(); s.onerror=()=>rej(); document.head.appendChild(s); }); }
const loadQRLib = () => loadLib('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js', ()=>!!window.QRCode);
function xfStat(t,ok){ XF.stat=t; XF.ok=!!ok; const el=$('xfstat'); if(el){ el.textContent=t; el.style.color=ok?'var(--kelp)':''; } }
function xfStop(){ clearTimeout(XF.timer); try{ XF.es&&XF.es.close(); }catch(e){} XF.es=null; XF.ready=false; XF.run++; }
const xfCodeFmt = c => c.slice(0,3)+' '+c.slice(3);
const xfTopic = code => XF_RELAY+XF_PREFIX+code;
// the newest progress parcel in a code's mailbox (or null)
async function xfLatest(code){ const r=await fetch(xfTopic(code)+'/json?poll=1&since=3h',{cache:'no-store'}); if(!r.ok) throw new Error('relay '+r.status);
  const lines=(await r.text()).trim().split('\n').filter(Boolean).map(l=>{ try{ return JSON.parse(l); }catch(e){ return null; } }).filter(m=>m&&m.event==='message'&&m.attachment&&m.attachment.url);
  return lines.length ? lines[lines.length-1] : null; }
async function xfSend(tries=0){ xfStop(); const run=XF.run; XF.mode='send'; XF.code=String(100000+Math.floor(Math.random()*900000)); xfStat('Getting your code ready…'); refreshXfer();
  try{
    if(tries<4 && await xfLatest(XF.code)) return xfSend(tries+1); // that code is in use right now: pick another
    const body=await makeCode();
    const r=await fetch(xfTopic(XF.code),{method:'PUT', body, headers:{'Filename':'driftline-progress.txt'}}); if(!r.ok) throw new Error('relay '+r.status);
    if(run!==XF.run) return; XF.ready=true; xfStat('Waiting for your other device… (the code works for 3 hours; if you keep playing here first, tap Send again)'); refreshXfer();

// Driftline 0.3 scene renderer, style B2 "Glow Diorama".
// Active only in the preview build (window.DL_PREVIEW) or with ?v3 in the URL.
// Areas move over one at a time (V3SCENES); the rest keep the old renderer.
// Speed: everything that doesn't move (mountains, shores, cabin, water base,

// size or the light changes; only living things are drawn every frame.
// =====================================================================
const V3ON = !!window.DL_PREVIEW || /[?&]v3\b/.test(location.search);
function v3rng(seed){ let s=(seed>>>0)||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function v3noise(seed){ const r=v3rng(seed), p=Array.from({length:128},()=>r()); return x=>{ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); const a=p[((i%128)+128)%128], b=p[(((i+1)%128)+128)%128]; return a+(b-a)*u; }; }
const v3s = x => x*x*(3-2*x); // smoothstep

  night:{top:'#05091a', mid:'#111a3c', bot:'#27306a', glow:'#c8d4ff', far:'#283058', farHaze:'#3a4478', snow:'#8e98c6', hill:'#1a2042', back:'#141a36', front:'#0c1126', bank:'#121a34', wTop:'#2a346c', wMid:'#131b40', wBot:'#04060e', rim:'#9fb4ff', cabin:'#1e1c32', roof:'#100e20', leaf:'#1c2838', leafHi:'#6f80c8', cloud:'#2a3058', cloudLit:'#5a66a0'}
