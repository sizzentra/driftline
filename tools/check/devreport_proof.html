<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Driftline: device report proof</title></head>
<body style="margin:0;background:#000">
<iframe id="f" style="border:0;width:915px;height:412px;display:block"></iframe>
<script>
// Proves the device report (layer 2): loads the Android test build at the Pixel's size, sits on the fishing screen, then on the
// Aquarium, and sends the device report text to /report/devreport. Started by hand (see docs/PROOF_PHASE2.md), never published.
(async function(){
  const f=document.getElementById('f'), wait=ms=>new Promise(r=>setTimeout(r,ms));
  f.src='/next/android.html?test&dlproof';
  await new Promise(r=>f.onload=r); await wait(4000);
  const w=f.contentWindow;
  await wait(8000);                        /* fishing screen */
  w.__ui.open('aquarium'); await wait(5000); w.eval("setTimeout(function(){ throw new Error('planted error for the proof'); },0)"); await wait(5000); /* Aquarium, with one planted error: it must be listed with this screen */
  w.__ui.close(); await wait(1500);
  const text=w.__devReport.text();
  await fetch('/report/devreport',{method:'POST',body:JSON.stringify({ok:true,text})});
  document.title='CHECK DONE';
})();
</script>
</body></html>
